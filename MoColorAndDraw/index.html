<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mo Color & Draw</title>
<meta name="theme-color" content="#ff8a3d">
<link rel="stylesheet" href="../NurConnect/fonts/fonts.css">
<style>
*{box-sizing:border-box;margin:0}
body{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px 16px;color:#fff;background:linear-gradient(160deg,#ffcf4d,#ff8a3d 50%,#ff5fa8);font:18px/1.5 "Baloo 2",-apple-system,system-ui,sans-serif}
.e{font-size:96px;animation:b 3s ease-in-out infinite}
@keyframes b{50%{transform:translateY(-12px) rotate(-6deg)}}
h1{font-family:"Lilita One",sans-serif;font-weight:400;font-size:clamp(40px,10vw,64px);line-height:1.05;margin:8px 0;text-shadow:0 4px 0 rgba(0,0,0,.12)}
p{font-weight:700;opacity:.95}
a{display:inline-block;margin-top:22px;background:#fff;color:#c2367a;font-weight:800;text-decoration:none;border-radius:999px;padding:12px 24px;box-shadow:0 8px 20px rgba(0,0,0,.15)}
</style>
</head>
<body>
<main>
  <div class="e">🎨</div>
  <h1>Mo Color &amp; Draw</h1>
  <p>Coming soon, insya Allah!</p>
  <a href="../">← Mo Games</a>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Pick a Voice</title>
<link rel="icon" href="../assets/favicon-32.png?v=2">
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
:root{--bg:#2b1478;--card:rgba(255,255,255,.1);--line:rgba(255,255,255,.16);--ink:#fff;--soft:#d6ccff;--gold:#ffd23f}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f4f0ff;--card:#fff;--line:#e4dcfb;--ink:#22124f;--soft:#62558c;--gold:#f0a800}}
:root[data-theme="light"]{--bg:#f4f0ff;--card:#fff;--line:#e4dcfb;--ink:#22124f;--soft:#62558c;--gold:#f0a800}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:600 16px/1.45 "Baloo 2",system-ui,sans-serif;padding:24px 16px 60px}
.w{max-width:860px;margin:0 auto}
h1{font:400 clamp(30px,6vw,42px)/1.05 "Lilita One",sans-serif;margin-bottom:6px;display:flex;align-items:center;gap:14px}
h1 img{width:64px;height:64px;border-radius:16px;box-shadow:0 6px 16px rgba(0,0,0,.25);flex:none}
.lead{color:var(--soft)}
.lines{margin:16px 0 4px;display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:14px;color:var(--soft)}
.lines b{color:var(--ink);display:block;margin-bottom:2px}
.f{display:flex;gap:8px;margin:16px 0}
.f button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:6px 14px;cursor:pointer}
.f button[aria-pressed=true]{background:var(--gold);color:#3b2600;border-color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.c{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px}
.c.pick{outline:3px solid var(--gold)}
.c h2{font:400 24px "Lilita One",sans-serif;display:flex;align-items:center;gap:8px}
.c h2 small{font:700 12px "Baloo 2",sans-serif;padding:2px 9px;border-radius:99px;background:var(--line)}
.c p{color:var(--soft);font-size:14px;margin-top:-6px}
.row{display:flex;gap:8px}
.pl{flex:1;font:800 15px "Baloo 2",sans-serif;border:0;border-radius:14px;padding:11px 8px;cursor:pointer;background:#7b3fe4;color:#fff;display:flex;align-items:center;justify-content:center;gap:6px}
.pl.on{background:var(--gold);color:#3b2600}
.pk{font:800 14px "Baloo 2",sans-serif;border:2px dashed var(--line);background:none;color:var(--ink);border-radius:14px;padding:9px;cursor:pointer}
.c.pick .pk{border-style:solid;border-color:var(--gold);background:var(--gold);color:#3b2600}
.empty{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px}
.empty code{background:var(--line);border-radius:6px;padding:2px 6px;font-size:14px;word-break:break-all}
.bar{position:sticky;bottom:12px;margin-top:20px;background:var(--gold);color:#3b2600;border-radius:18px;padding:12px 16px;font-weight:800;display:none}
.bar.on{display:block}
</style>
</head>
<body><main class="w">
<h1><img src="../assets/icon-192.png?v=2" alt="">Pick Nur Connect's voice</h1>
<p class="lead">Every voice says the same game cheers. Tap 🇬🇧 or 🇮🇩 to listen, then tap "This one" on your favourite.</p>
<div class="lines" id="lines"></div>
<div class="f" role="group" aria-label="Filter"><button data-g="all" aria-pressed="true">All</button><button data-g="female" aria-pressed="false">Female</button><button data-g="male" aria-pressed="false">Male</button></div>
<div class="grid" id="grid"></div>
<div class="bar" id="bar"></div>
</main>
<script>
const grid=document.getElementById('grid'),bar=document.getElementById('bar');let D=null,G='all',cur=null,btn=null;
let picked=null;try{picked=localStorage.getItem('ncVoicePick')}catch(e){}
function render(){
  if(!D){grid.innerHTML=`<div class="empty"><b>The samples aren't made yet.</b><p class="lead" style="margin-top:6px">Open Google Cloud Shell, then run:<br><code>git clone https://github.com/roisa/app-ayah.git && cd app-ayah</code><br><code>bash NurConnect/tools/voice/cloudshell.sh compare</code><br>When it says "pushed nc-voice-compare-…", tell Claude.</p></div>`;return}
  document.getElementById('lines').innerHTML=['en','id'].map(l=>`<div><b>${l==='en'?'🇬🇧 English':'🇮🇩 Indonesia'}</b>${D.lines[l].join(' · ')}</div>`).join('');
  grid.innerHTML=D.voices.filter(v=>G==='all'||v.gender===G).map(v=>`<div class="c${picked===v.voice?' pick':''}"><h2>${v.voice}<small>${v.gender==='female'?'♀ female':'♂ male'}</small></h2><p>${v.desc}</p>
   <div class="row">${['en','id'].filter(l=>v.files[l]).map(l=>`<button class="pl" data-f="compare/${v.files[l]}">▶ ${l==='en'?'🇬🇧 EN':'🇮🇩 ID'}</button>`).join('')}</div>
   <button class="pk" data-v="${v.voice}">${picked===v.voice?'✓ My pick':'This one'}</button></div>`).join('');
  bar.classList.toggle('on',!!picked);bar.textContent=picked?`Your pick: ${picked}. Tell Claude: "use ${picked}"`:''}
const au=new Audio();au.onended=()=>{if(btn)btn.classList.remove('on');cur=null};
document.addEventListener('click',e=>{const p=e.target.closest('.pl');if(p){if(btn)btn.classList.remove('on');if(cur===p.dataset.f){au.pause();cur=null;return}cur=p.dataset.f;btn=p;au.src=cur;au.play();p.classList.add('on');return}
  const k=e.target.closest('.pk');if(k){picked=k.dataset.v;try{localStorage.setItem('ncVoicePick',picked)}catch(e){}render();return}
  const f=e.target.closest('.f button');if(f){G=f.dataset.g;document.querySelectorAll('.f button').forEach(b=>b.setAttribute('aria-pressed',b===f));render()}});
fetch('compare/compare.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>{D=j;render()}).catch(()=>render());
</script>
</body></html>

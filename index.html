<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2B1478">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nur Connect">
<meta name="description" content="Nur Connect — Islamic pair-matching puzzle for Muslim families. Bismillah to start, pause for prayer, Alhamdulillah to finish.">
<title>Nur Connect</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preload" as="image" href="assets/bg/twilight-mosque.webp">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]:not([hidden=until-found i]){display:none!important}

/* Layout: full-bleed theme background; HUD pills on top, tile board in the middle, 3D tool buttons at the bottom.
   Overlays are purple game cards with a ribbon title. */
:root{
  --v1:#7B4DFF; --v2:#5A2FE0; --v3:#3D1BA8; --v4:#2B1478; --v-ink:#1C0B55;
  --gold:#FFC93C; --gold-deep:#D98A00;
  --green:#4CD964; --green-deep:#1F9A47;
  --red:#FF5A5F; --red-deep:#C72E3A;
  --cream:#FFF7E6;
  --text:#FFFFFF; --muted:#D9CFFF; --ok:#5BE37D;
  --f-display:"Lilita One","Baloo 2",system-ui,sans-serif;
  --f-body:"Baloo 2",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-arab:"Amiri","Traditional Arabic","Geeza Pro",serif;
  --f-arab-fun:"Baloo Bhaijaan 2","Amiri","Geeza Pro",serif;
  color-scheme:dark;
}
html,body{height:100%}
body{
  background:var(--v4); color:var(--text); font-family:var(--f-body);
  padding-left:max(12px,env(safe-area-inset-left,0px)); padding-right:max(12px,env(safe-area-inset-right,0px));
  overflow:hidden; overscroll-behavior:none; touch-action:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; user-select:none;
}
img{-webkit-user-drag:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* theme background, cross-faded per level */
.bg{position:fixed;inset:0;z-index:-1;background:var(--v4) center/cover no-repeat;transition:opacity .6s}
.bg::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(28,11,85,.55) 0%,rgba(28,11,85,0) 22%,rgba(28,11,85,0) 78%,rgba(28,11,85,.5) 100%)}
#bgB{opacity:0}

#app{height:100%;display:flex;flex-direction:column;max-width:640px;margin:0 auto}

/* HUD */
.hud{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:10px 4px}
.pill{display:flex;align-items:center;gap:6px;height:38px;padding:0 14px 0 8px;border-radius:999px;background:rgba(28,11,85,.62);border:2px solid rgba(255,255,255,.18);
  font-family:var(--f-display);font-size:19px;letter-spacing:.3px;font-variant-numeric:tabular-nums;white-space:nowrap;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);box-shadow:0 3px 0 rgba(0,0,0,.25)}
.pill img,.pill svg{width:28px;height:28px;flex:none}
.pill .hash{color:var(--gold);font-size:22px;padding-left:4px}
.pill.timer.low{background:rgba(199,46,58,.75)}
.bar{height:7px;border-radius:7px;background:rgba(28,11,85,.55);overflow:hidden;margin:4px 6px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#FFE27A,var(--gold),var(--gold-deep));border-radius:7px;transition:width .25s linear}
.bar.low i{background:linear-gradient(90deg,#FF8A8E,var(--red))}
.pchip{display:flex;justify-content:center;padding:6px 0 2px}
.pchip span{font-size:13px;font-weight:600;color:#fff;background:rgba(28,11,85,.55);padding:3px 12px;border-radius:999px;font-variant-numeric:tabular-nums;backdrop-filter:blur(4px)}
.pchip b{color:var(--gold);font-weight:800}

/* Board */
#boardArea{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
#cv{position:absolute;inset:0;display:block;touch-action:none}

/* Praise toast: chunky outlined cartoon text */
#praise{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%) rotate(-3deg) scale(.6);opacity:0;pointer-events:none;text-align:center;transition:transform .35s cubic-bezier(.34,1.7,.64,1),opacity .2s!important;
  background:linear-gradient(180deg,var(--v1),var(--v3));border:3px solid var(--gold);border-radius:24px;padding:12px 22px 14px;min-width:min(300px,92%);max-width:94%;box-shadow:0 8px 0 var(--v-ink),0 18px 30px rgba(0,0,0,.35)}
#praise.on{opacity:1;transform:translate(-50%,-50%) rotate(-3deg) scale(1)}
#praise .ar{font-family:var(--f-arab-fun);font-weight:800;font-size:36px;color:var(--gold);line-height:1.35;direction:rtl;text-shadow:0 3px 0 #7A4D0F,0 6px 14px rgba(0,0,0,.35)}
#praise .tr{font-family:var(--f-display);font-size:27px;line-height:1.1;color:#fff;letter-spacing:.4px;-webkit-text-stroke:6px var(--v-ink);paint-order:stroke fill;text-shadow:0 4px 0 rgba(0,0,0,.3)}
#praise .mn{font-size:13px;font-weight:600;color:var(--muted);margin-top:2px}

/* small toast above everything (home screen messages) */
#toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translate(-50%,-20px);opacity:0;z-index:60;pointer-events:none;
  background:var(--v-ink);border:2px solid var(--gold);color:#fff;font-weight:700;padding:10px 18px;border-radius:16px;transition:.25s;max-width:90%;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* Dock: glossy 3D tool buttons */
.dock{display:flex;justify-content:center;align-items:flex-end;gap:10px;padding-block:8px calc(12px + env(safe-area-inset-bottom,0px))}
.tool{position:relative;width:62px;height:62px;border:0;border-radius:20px;padding:0;display:grid;place-items:center;
  background:linear-gradient(180deg,#FFFFFF,#E6DEFF);box-shadow:0 5px 0 #A99BE0,0 9px 14px rgba(0,0,0,.3);transition:transform .08s}
.tool:active{transform:translateY(3px);box-shadow:0 2px 0 #A99BE0,0 4px 8px rgba(0,0,0,.3)}
.tool img{width:44px;height:44px}
.tool svg{width:26px;height:26px;color:var(--v3)}
.tool.sm{width:50px;height:50px;border-radius:16px;background:linear-gradient(180deg,var(--v1),var(--v2));box-shadow:0 5px 0 var(--v-ink),0 9px 14px rgba(0,0,0,.3)}
.tool.sm svg{color:#fff;width:28px;height:28px}
.tool .n{position:absolute;top:-7px;right:-7px;min-width:26px;height:26px;padding:0 6px;border-radius:13px;background:var(--red);border:2px solid #fff;
  font-family:var(--f-display);font-size:15px;line-height:22px;color:#fff;font-variant-numeric:tabular-nums}
.tool:disabled{filter:grayscale(1);opacity:.55}

/* Overlays */
.ov{position:fixed;inset:0;z-index:20;display:grid;place-items:center;overflow:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch;padding:max(56px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));
  background:rgba(28,11,85,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.ov.lock{z-index:40;background:rgba(28,11,85,.8)}
.card{position:relative;width:100%;max-width:400px;background:linear-gradient(180deg,var(--v1) 0%,var(--v2) 55%,var(--v3) 100%);
  border:3px solid rgba(255,255,255,.28);border-radius:30px;padding:74px 20px 22px;text-align:center;display:flex;flex-direction:column;gap:12px;
  box-shadow:0 10px 0 var(--v-ink),0 24px 40px rgba(0,0,0,.4)}
.card.plain{padding-top:22px}
.ribbon{position:absolute;left:50%;top:-40px;transform:translateX(-50%);width:min(300px,92%);aspect-ratio:720/264;display:grid;place-items:center;pointer-events:none}
.ribbon img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.ribbon span{position:relative;top:-9%;font-family:var(--f-display);font-size:23px;color:#fff;letter-spacing:.5px;-webkit-text-stroke:5px rgba(60,10,10,.55);paint-order:stroke fill;text-shadow:0 3px 0 rgba(0,0,0,.25);white-space:nowrap}
.ribbon.green span{-webkit-text-stroke-color:rgba(10,60,20,.55)}
.card h1{margin:0;font-family:var(--f-display);font-size:46px;font-weight:400;color:var(--gold);letter-spacing:1px;line-height:1;-webkit-text-stroke:7px var(--v-ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--v-ink)}
.card h2{margin:0;font-family:var(--f-display);font-size:28px;font-weight:400;letter-spacing:.4px;text-wrap:balance;-webkit-text-stroke:5px var(--v-ink);paint-order:stroke fill}
.card p{margin:0;color:var(--muted);font-size:15px;font-weight:600;line-height:1.5;text-wrap:balance}
.ar-big{font-family:var(--f-arab);font-size:32px;line-height:1.7;color:var(--gold);direction:rtl;text-shadow:0 2px 0 rgba(0,0,0,.3)}
.btn{border:0;border-radius:20px;padding:14px 18px;font-family:var(--f-display);font-size:22px;letter-spacing:.6px;color:#fff;
  background:linear-gradient(180deg,#7DF08F,var(--green));box-shadow:0 6px 0 var(--green-deep),0 10px 16px rgba(0,0,0,.25);text-shadow:0 2px 0 rgba(0,0,0,.25);transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--green-deep)}
.btn:disabled{background:#8E86B5;box-shadow:0 6px 0 #5E5690;text-shadow:none}
.btn.ghost{background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.3);box-shadow:0 4px 0 rgba(28,11,85,.6);font-size:19px;padding:11px 16px}
.btn.gold{background:linear-gradient(180deg,#FFE27A,var(--gold));color:#5A3200;text-shadow:none;box-shadow:0 6px 0 var(--gold-deep),0 10px 16px rgba(0,0,0,.25)}
.btn.gold:disabled{background:#8E86B5;color:#E8E4FF;box-shadow:0 6px 0 #5E5690}
.row{display:flex;gap:10px}.row>*{flex:1}
.hero{width:150px;height:150px;margin:-6px auto -4px;object-fit:contain;filter:drop-shadow(0 10px 14px rgba(0,0,0,.35));animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-2deg)}}
.rate{display:flex;justify-content:center;align-items:flex-end;gap:4px;height:62px}
.rate img{width:52px;height:52px;filter:drop-shadow(0 4px 4px rgba(0,0,0,.3));transform:scale(0);animation:pop .45s cubic-bezier(.34,1.7,.64,1) forwards}
.rate img:nth-child(2){width:62px;height:62px;animation-delay:.18s}.rate img:nth-child(3){animation-delay:.36s}
.rate img.off{filter:grayscale(1) brightness(.55);opacity:.6}
@keyframes pop{to{transform:scale(1)}}
.gift{display:flex;align-items:center;justify-content:center;gap:10px;background:rgba(28,11,85,.4);border-radius:16px;padding:8px 12px;font-weight:700}
.gift img{width:46px;height:46px}
.count{font-variant-numeric:tabular-nums;font-size:15px;font-weight:700;color:var(--muted)}

/* Home */
.home{width:100%;max-width:440px;display:flex;flex-direction:column;gap:10px;text-align:center;margin-top:-30px}
.logo .ar{font-family:var(--f-arab-fun);font-weight:800;font-size:30px;color:var(--gold);line-height:1;text-shadow:0 3px 0 var(--v-ink)}
.logo h1{margin:0;font-family:var(--f-display);font-weight:400;font-size:50px;line-height:1;color:#fff;letter-spacing:1px;-webkit-text-stroke:9px var(--v-ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--v-ink),0 12px 24px rgba(0,0,0,.35);transform:rotate(-2deg)}
.logo h1 em{font-style:normal;color:var(--gold)}
.logo p{margin:4px 0 0;font-weight:700;font-size:14px;line-height:1.3;color:#fff;text-shadow:0 2px 6px rgba(28,11,85,.9)}
.statline{display:flex;justify-content:center;gap:10px}
.worlds{display:grid;grid-template-columns:repeat(4,1fr);gap:4px 4px;background:rgba(28,11,85,.5);border:2px solid rgba(255,255,255,.18);border-radius:24px;padding:8px 10px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.world{position:relative;border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:2px}
.world img{width:100%;max-width:78px;aspect-ratio:1;object-fit:contain;filter:drop-shadow(0 5px 6px rgba(0,0,0,.35));transition:transform .15s}
.world:active img{transform:scale(.94)}
.world b{font-family:var(--f-display);font-weight:400;font-size:12.5px;letter-spacing:.2px;line-height:1.1;min-height:2.2em;display:flex;align-items:center}
.world small{font-size:11.5px;font-weight:700;color:var(--muted);line-height:1}
.world.locked img{filter:grayscale(.9) brightness(.6) drop-shadow(0 5px 6px rgba(0,0,0,.35))}
.world.locked::after{content:'';position:absolute;top:16%;left:50%;width:34px;height:34px;transform:translateX(-50%);
  background:url(assets/ui/padlock.webp) center/contain no-repeat;filter:drop-shadow(0 3px 3px rgba(0,0,0,.4))}
.world.cur img{animation:bob 2.4s ease-in-out infinite}
.sched-box{background:rgba(28,11,85,.5);border:2px solid rgba(255,255,255,.18);border-radius:20px;padding:10px;display:flex;flex-direction:column;gap:6px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.sched-box label{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.8px}
.sched{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.sched div{background:rgba(255,255,255,.08);border-radius:12px;padding:5px 2px;display:flex;flex-direction:column;align-items:center;border:2px solid transparent}
.sched .now{border-color:var(--gold);background:rgba(255,201,60,.15)}
.sched small{font-size:11px;font-weight:700;color:var(--muted)}
.sched b{font-family:var(--f-display);font-weight:400;font-size:16px;font-variant-numeric:tabular-nums;letter-spacing:.3px}
.sched .ck{font-size:11px;color:var(--ok);height:12px;line-height:12px}
.meta{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.2px}
.homebar{display:flex;gap:10px;align-items:center}
.homebar .btn{flex:1}

/* Settings */
.field{display:flex;flex-direction:column;gap:6px;text-align:left}
.field label{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.8px}
.field select,.field input{background:var(--v-ink);color:#fff;border:2px solid rgba(255,255,255,.18);border-radius:14px;padding:10px 12px;font:inherit;font-weight:700;width:100%}
.seg{display:flex;background:var(--v-ink);border:2px solid rgba(255,255,255,.14);border-radius:14px;padding:3px}
.seg button{flex:1;border:0;background:transparent;padding:7px;border-radius:10px;font-weight:800;font-size:14px}
.seg button.on{background:linear-gradient(180deg,#FFE27A,var(--gold));color:#5A3200}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-height:760px){.hero{width:110px;height:110px}.logo h1{font-size:42px}.logo .ar{font-size:24px}.world img{max-width:66px}.world small{display:none}}
</style>
</head>
<body>

<div class="bg" id="bgA"></div><div class="bg" id="bgB"></div>

<div id="app">
  <div class="hud">
    <div class="pill" id="lvlPill"><span class="hash">#</span><span id="lvl">1</span></div>
    <div class="pill timer" id="timerPill"><img src="assets/ui/stopwatch.webp" alt=""><span id="time">0:00</span></div>
    <div class="pill"><img src="assets/ui/star.webp" alt=""><span id="stars">0</span></div>
  </div>
  <div class="bar" id="bar"><i id="barFill" style="width:100%"></i></div>
  <div class="pchip"><span id="pchip">—</span></div>
  <div id="boardArea">
    <canvas id="cv"></canvas>
    <div id="praise"><div class="ar"></div><div class="tr"></div><div class="mn"></div></div>
  </div>
  <div class="dock">
    <button class="tool sm" id="bPause" aria-label="Pause"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="5.5" y="4.5" width="4.6" height="15" rx="1.6"/><rect x="13.9" y="4.5" width="4.6" height="15" rx="1.6"/></svg></button>
    <button class="tool" id="bUndo" aria-label="Undo"><img src="assets/ui/undo.webp" alt=""><span class="n" id="nUndo">3</span></button>
    <button class="tool" id="bShuf" aria-label="Shuffle"><img src="assets/ui/shuffle.webp" alt=""><span class="n" id="nShuf">2</span></button>
    <button class="tool" id="bHint" aria-label="Hint"><img src="assets/ui/hint.webp" alt=""><span class="n" id="nHint">3</span></button>
    <button class="tool sm" id="bSet" aria-label="Settings"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M19.83 9.58 L22.78 9.81 L22.78 14.19 L19.83 14.42 L19.25 15.83 L21.17 18.08 L18.08 21.17 L15.83 19.25 L14.42 19.83 L14.19 22.78 L9.81 22.78 L9.58 19.83 L8.17 19.25 L5.92 21.17 L2.83 18.08 L4.75 15.83 L4.17 14.42 L1.22 14.19 L1.22 9.81 L4.17 9.58 L4.75 8.17 L2.83 5.92 L5.92 2.83 L8.17 4.75 L9.58 4.17 L9.81 1.22 L14.19 1.22 L14.42 4.17 L15.83 4.75 L18.08 2.83 L21.17 5.92 L19.25 8.17Z M15.4 12A3.4 3.4 0 1 0 8.6 12A3.4 3.4 0 1 0 15.4 12Z"/></svg></button>
  </div>
</div>

<!-- Home: logo, world map, prayer times -->
<div class="ov" id="ovHome">
  <div class="home">
    <div class="logo"><div class="ar">نُور</div><h1>Nur <em>Connect</em></h1><p id="tTag"></p></div>
    <div class="statline"><div class="pill"><span class="hash">#</span><span id="hLvl">1</span></div><div class="pill"><img src="assets/ui/star.webp" alt=""><span id="hStars">0</span></div></div>
    <div class="worlds" id="worlds"></div>
    <div class="homebar"><button class="btn" id="bStart"></button><button class="tool sm" id="bHomeSet" aria-label="Settings"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M19.83 9.58 L22.78 9.81 L22.78 14.19 L19.83 14.42 L19.25 15.83 L21.17 18.08 L18.08 21.17 L15.83 19.25 L14.42 19.83 L14.19 22.78 L9.81 22.78 L9.58 19.83 L8.17 19.25 L5.92 21.17 L2.83 18.08 L4.75 15.83 L4.17 14.42 L1.22 14.19 L1.22 9.81 L4.17 9.58 L4.75 8.17 L2.83 5.92 L5.92 2.83 L8.17 4.75 L9.58 4.17 L9.81 1.22 L14.19 1.22 L14.42 4.17 L15.83 4.75 L18.08 2.83 L21.17 5.92 L19.25 8.17Z M15.4 12A3.4 3.4 0 1 0 8.6 12A3.4 3.4 0 1 0 15.4 12Z"/></svg></button></div>
    <div class="sched-box"><label id="tSched"></label><div class="sched" id="sched"></div><div class="meta" id="schedMeta"></div></div>
  </div>
</div>

<!-- Bismillah gate -->
<div class="ov" id="ovBis" hidden>
  <div class="card">
    <div class="ribbon green"><img src="assets/ui/ribbon-green.webp" alt=""><span id="bisLvl">Level 1</span></div>
    <img class="hero" id="bisArt" src="assets/badges/mosque.webp" alt="">
    <div class="ar-big">بِسْمِ ٱللَّٰهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ</div>
    <p id="bisMean"></p>
    <button class="btn" id="bBis">Bismillah</button>
  </div>
</div>

<!-- Level clear -->
<div class="ov" id="ovWin" hidden>
  <div class="card">
    <div class="ribbon green"><img src="assets/ui/ribbon-green.webp" alt=""><span id="winRib"></span></div>
    <div class="rate" id="rate"></div>
    <img class="hero" src="assets/ui/trophy.webp" alt="">
    <div class="ar-big" style="font-size:40px;line-height:1.4">ٱلْحَمْدُ لِلَّٰهِ</div>
    <h2 id="winTitle"></h2>
    <p id="winBody"></p>
    <div class="gift" id="winGift" hidden><img src="assets/ui/gift.webp" alt=""><span id="winGiftT"></span></div>
    <button class="btn" id="bNext"></button>
    <button class="btn ghost" id="bWinHome"></button>
  </div>
</div>

<!-- Time up -->
<div class="ov" id="ovLose" hidden>
  <div class="card">
    <div class="ribbon"><img src="assets/ui/ribbon-red.webp" alt=""><span id="loseTitle"></span></div>
    <div class="ar-big" style="font-size:28px;margin-top:6px">قَدَّرَ ٱللَّٰهُ وَمَا شَاءَ فَعَلَ</div>
    <p id="loseBody"></p>
    <button class="btn" id="bRetry"></button>
    <button class="btn ghost" id="bLoseHome"></button>
  </div>
</div>

<!-- Pause -->
<div class="ov" id="ovPause" hidden>

const R2D=180/Math.PI,D2R=Math.PI/180;

let ac=null,master=null,verb=null;

    verb=ac.createConvolver();verb.buffer=impulse(1.8,2.6);const vg=ac.createGain();vg.gain.value=.25;verb.connect(vg).connect(comp)}catch(e){ac=null}}

requestAnimationFrame(frame);

function hud(){$('#lvl').textContent=G.level;$('#stars').textContent=G.total+G.stars;$('#nHint').textContent=G.hints;$('#nShuf').textContent=G.shuf;$('#nUndo').textContent=G.undo;
  $('#bHint').disabled=G.hints<=0;$('#bShuf').disabled=G.shuf<=0;$('#bUndo').disabled=G.undo<=0||!G.hist.length;$('#timerPill').classList.toggle('low',G.time<=10&&G.max>0);const s=Math.max(0,Math.ceil(G.time));$('#time').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
  $('#barFill').style.width=(G.max?G.time/G.max*100:100)+'%';$('#bar').classList.toggle('low',G.time<G.max*.2)}
let praiseT=null;function praise(k,override){const P=PR[k],L=P[S.lang],el=$('#praise');el.querySelector('.ar').textContent=P.ar;el.querySelector('.tr').textContent=override||L[0];el.querySelector('.mn').textContent=override?'':L[2];el.classList.remove('on');void el.offsetWidth;el.classList.add('on');clearTimeout(praiseT);praiseT=setTimeout(()=>el.classList.remove('on'),1700);voice(k,L[1])}

/* ---------- Flow ---------- */
const OVS=['ovHome','ovBis','ovWin','ovLose','ovPause','ovSet'];
function show(id){OVS.forEach(o=>$('#'+o).hidden=o!==id)}
function anyOv(){return OVS.some(o=>!$('#'+o).hidden)}
function blocked(){return anyOv()||!$('#ovLock').hidden||document.hidden}
function goHome(){G.running=false;renderHome();show('ovHome')}
function gate(){$('#bisLvl').textContent=t('level')+' '+G.level;$('#bisArt').src=`assets/badges/${curWorld().id}.webp`;show('ovBis')}
function rating(){const f=G.max?G.time/G.max:0;return f>=.5?3:f>=.25?2:1}
$('#bStart').onclick=()=>{ensureAudio();if(!G.grid.length||!G.running)newLevel();gate()};
$('#bHomeSet').onclick=()=>openSettings();
$('#bBis').onclick=()=>{ensureAudio();show(null);G.running=true;hurried=false;praise('bismillah');sfx.start()};
function win(){G.running=false;const bonus=Math.floor(G.time/6),rt=rating(),gift=G.level%5===0?10:0;G.stars+=bonus+gift;G.total+=G.stars;store.set('stars',G.total);
  $('#winRib').textContent=t('cleared',{n:G.level});$('#rate').innerHTML=[1,2,3].map(i=>`<img src="assets/ui/star.webp" alt="" class="${i<=rt?'':'off'}">`).join('');
  $('#winGift').hidden=!gift;$('#winGiftT').textContent=t('gift',{g:gift});
  $('#winTitle').textContent=t('winT');$('#winBody').textContent=t('winB',{s:G.stars,b:bonus});G.level++;store.set('lv:'+curWorld().id,G.level);sfx.win();voice('win');show('ovWin');hud()}
$('#bNext').onclick=()=>{newLevel();gate()};
$('#bWinHome').onclick=()=>{G.grid=[];goHome()};
function lose(){G.running=false;G.stars=0;$('#loseTitle').textContent=t('loseT');$('#loseBody').textContent=t('loseB');sfx.lose();voice('lose');show('ovLose')}
$('#bRetry').onclick=()=>{newLevel();gate()};
$('#bLoseHome').onclick=()=>{G.grid=[];goHome()};
$('#bResume').onclick=()=>show(null);
$('#bPauseHome').onclick=()=>goHome();

let lastTick=Date.now(),hurried=false;
setInterval(()=>{const n=Date.now(),dt=(n-lastTick)/1000;lastTick=n;
  if(G.running&&!blocked()){const before=Math.ceil(G.time);G.time-=dt;if(G.time<=0){G.time=0;hud();lose();return}const sec=Math.ceil(G.time);if(sec<before&&sec<=10){sfx.tick(sec<=3);if(sec===10&&!hurried){hurried=true;voice('hurry')}}hud()}
  tickPrayer(n)},250);

/* ---------- Prayer lock ---------- */
let lock=null,lastCheck=0;
function tickPrayer(now){
  if(now-lastCheck>5000||lock){if(!lock||!lock.demo){lastCheck=now;const a=activePrayer(now);
      if(a&&!prayed[a.key]){if(!lock||lock.key!==a.key){lock={...a,demo:false};openLock()}}else if(lock){closeLock(false)}}}
  if(lock)renderLock(now);
  if(now%1000<260)renderChip(now)}
function openLock(){$('#ovLock').hidden=false;G.sel=null;drag=null;sfx.bell();voice('pray',null,{p:pn(lock.p)});renderLock(Date.now())}
function renderLock(now){const p=pn(lock.p);$('#lockRib').textContent=t('lockRib');$('#lockTitle').textContent=t('lockT',{p});$('#lockBody').textContent=t('lockB',{p});
  const ready=lock.demo?lock.readyAt:lock.start+S.wait*60000,rem=ready-now,b=$('#bPrayed');b.textContent=t('prayed',{p});
  if(rem>0){b.disabled=true;const s=Math.ceil(rem/1000);$('#lockCount').textContent=t('lockWait',{m:Math.floor(s/60)+':'+String(s%60).padStart(2,'0')})}else{b.disabled=false;$('#lockCount').textContent=t('lockReady')}}
function closeLock(thanks){$('#ovLock').hidden=true;const was=lock;lock=null;if(thanks){praise('taqabbal');sfx.praise()}renderHome();return was}
$('#bPrayed').onclick=()=>{if(!lock)return;ensureAudio();if(!lock.demo)markPrayed(lock.key);closeLock(true);lastCheck=0};
function renderChip(now){const a=activePrayer(now),nx=nextPrayer(now),c=cityInfo();let s='';
  if(a&&prayed[a.key])s='✓ '+pn(a.p)+' · ';
  s+=t('next2',{p:'<b>'+pn(nx.p)+'</b>',t:nx.at?fmtT(nx.at,c.tz):'—',d:nx.at?dur(nx.at-now):'—'});$('#pchip').innerHTML=s+' · '+c.name}

/* ---------- Home ---------- */
function renderWorlds(){$('#worlds').innerHTML=WORLDS.map((w,i)=>`<button class="world${!w.open?' locked':i===worldIdx?' cur':''}" data-i="${i}"><img src="assets/badges/${w.id}.webp" alt=""><b>${w.name[S.lang]}</b><small>${w.open?t('worldLvl',{n:getLv(w.id)}):t('locked')}</small></button>`).join('')}
$('#worlds').onclick=e=>{const b=e.target.closest('.world');if(!b)return;ensureAudio();const w=WORLDS[+b.dataset.i];
  if(!w.open){sfx.bad();toast(t('soon',{w:w.name[S.lang]}));return}
  const i=+b.dataset.i;if(i!==worldIdx){worldIdx=i;store.set('world',w.id);G.level=getLv(w.id);G.grid=[];G.running=false;loadIcons();renderHome()}
  $('#bStart').click()};
function renderHome(){const c=cityInfo(),td=sched(0),now=Date.now(),a=activePrayer(now);
  $('#tTag').textContent=t('tag');$('#hLvl').textContent=G.level;$('#hStars').textContent=G.total;renderWorlds();if(!G.running)setBg(levelBg(G.level));
  $('#tSched').textContent=t('sched')+' · '+c.name;$('#schedMeta').textContent=t('method');
  $('#sched').innerHTML=FIVE.map(p=>{const k=td.key+':'+p,isNow=a&&a.key===k;return`<div class="${isNow?'now':''}"><small>${pn(p)}</small><b>${td.t[p]?fmtT(td.t[p],c.tz):'—'}</b><span class="ck">${prayed[k]?'✓':''}</span></div>`}).join('');
  $('#bStart').textContent=(G.level>1?t('cont',{n:G.level}):t('start'));
  $('#bisMean').textContent=t('bisMean');$('#bBis').textContent=t('bis');$('#bNext').textContent=t('next');$('#bWinHome').textContent=t('home');
  $('#bRetry').textContent=t('retry');$('#bLoseHome').textContent=t('home');$('#pauseTitle').textContent=t('pause');$('#pauseBody').textContent=t('pauseB');
  $('#bResume').textContent=t('resume');$('#bPauseHome').textContent=t('home');hud();renderChip(now)}

/* ---------- Settings ---------- */
let returnTo='ovHome';
function openSettings(){returnTo=OVS.find(o=>!$('#'+o).hidden)||(G.running?null:'ovHome');
  $('#setTitle').textContent=t('setT');$('#lCity').textContent=t('city');$('#lLang').textContent=t('lang');$('#lWait').textContent=t('wait');$('#lSound').textContent=t('sound');$('#lVoice').textContent=t('voice');
  $('#bPreview').textContent=t('preview');$('#bReset').textContent=t('reset');$('#bSetDone').textContent=t('done');
  for(const id of ['segSound','segVoice']){const sb=$('#'+id).children;sb[0].textContent=t('on');sb[1].textContent=t('off')}
  $('#city').innerHTML=CITIES.map(c=>`<option value="${c[0]}">${c[0]==='custom'?t('custom'):c[1]}</option>`).join('');$('#city').value=S.city;
  $('#lat').value=S.lat;$('#lng').value=S.lng;$('#customRow').hidden=S.city!=='custom';segs();show('ovSet')}
function segs(){[['segLang','lang'],['segWait','wait'],['segSound','sound'],['segVoice','voice']].forEach(([id,k])=>[...$('#'+id).children].forEach(b=>b.classList.toggle('on',String(S[k])===b.dataset.v)))}
function save(){store.set('settings',S);cache={};lastCheck=0}
$('#city').onchange=e=>{S.city=e.target.value;$('#customRow').hidden=S.city!=='custom';save()};
$('#lat').oninput=e=>{S.lat=parseFloat(e.target.value)||0;save()};$('#lng').oninput=e=>{S.lng=parseFloat(e.target.value)||0;save()};
$('#segLang').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.lang=b.dataset.v;save();openSettings();renderHome()};
$('#segWait').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.wait=+b.dataset.v;save();segs()};
$('#segSound').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.sound=+b.dataset.v;save();segs();ensureAudio();sfx.click()};
$('#segVoice').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.voice=+b.dataset.v;save();segs();ensureAudio();if(S.voice)voice('masya1',PR.masya1[S.lang][1]);else stopVoice()};
$('#bPreview').onclick=()=>{ensureAudio();const nx=nextPrayer(Date.now());$('#ovSet').hidden=true;if(returnTo&&returnTo!=='ovSet')$('#'+returnTo).hidden=false;lock={p:nx.p,key:'demo',demo:true,readyAt:Date.now()+8000};openLock()};
$('#bReset').onclick=()=>{G.level=1;G.total=0;G.grid=[];G.running=false;store.set('level',1);WORLDS.forEach(w=>store.set('lv:'+w.id,1));store.set('stars',0);$('#bReset').textContent=t('resetDone');returnTo='ovHome'};
$('#bSetDone').onclick=()=>{renderHome();show(returnTo)};

window.addEventListener('resize',fit);fit();
renderHome();show('ovHome');tickPrayer(Date.now());
})();
</script>

</body>
</html>

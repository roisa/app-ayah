<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2B1478">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nur Connect">
<meta name="description" content="Nur Connect — Islamic pair-matching puzzle for Muslim families. Bismillah to start, pause for prayer, Alhamdulillah to finish.">
<title>Nur Connect</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preload" as="image" href="assets/bg/intro.webp">
<link rel="preload" as="image" href="assets/ui/logo.webp">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]:not([hidden=until-found i]){display:none!important}

/* Layout: full-bleed theme background; HUD pills on top, tile board in the middle, 3D tool buttons at the bottom.
   Overlays are purple game cards with a ribbon title. */
:root{
  --v1:#7B4DFF; --v2:#5A2FE0; --v3:#3D1BA8; --v4:#2B1478; --v-ink:#1C0B55;
  --gold:#FFC93C; --gold-deep:#D98A00;
  --green:#4CD964; --green-deep:#1F9A47;
  --red:#FF5A5F; --red-deep:#C72E3A;
  --cream:#FFF7E6;
  --text:#FFFFFF; --muted:#D9CFFF; --ok:#5BE37D;
  --f-display:"Lilita One","Baloo 2",system-ui,sans-serif;
  --f-body:"Baloo 2",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-arab:"Baloo Bhaijaan 2","Traditional Arabic","Geeza Pro",sans-serif;
  --f-arab-fun:"Baloo Bhaijaan 2","Geeza Pro",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{
  background:var(--v4); color:var(--text); font-family:var(--f-body);
  padding-left:max(12px,env(safe-area-inset-left,0px)); padding-right:max(12px,env(safe-area-inset-right,0px));
  overflow:hidden; overscroll-behavior:none; touch-action:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; user-select:none;
}
img{-webkit-user-drag:none;user-select:none}
*{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,select,textarea{-webkit-user-select:text;user-select:text}
#boardArea,#cv{-webkit-user-select:none;user-select:none;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* theme background, cross-faded per level */
.bg{position:fixed;inset:0;z-index:-1;background:var(--v4) center/cover no-repeat;transition:opacity .6s}
.bg::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(28,11,85,.55) 0%,rgba(28,11,85,0) 22%,rgba(28,11,85,0) 78%,rgba(28,11,85,.5) 100%)}
#bgB{opacity:0}

#app{height:100%;display:flex;flex-direction:column;max-width:640px;margin:0 auto}

/* HUD */
.hud{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:10px 4px}
.pill{display:flex;align-items:center;gap:6px;height:38px;padding:0 14px 0 8px;border-radius:999px;background:rgba(28,11,85,.62);border:2px solid rgba(255,255,255,.18);
  font-family:var(--f-display);font-size:19px;letter-spacing:.3px;font-variant-numeric:tabular-nums;white-space:nowrap;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);box-shadow:0 3px 0 rgba(0,0,0,.25)}
.pill img,.pill svg{width:28px;height:28px;flex:none}
.pill .hash{color:var(--gold);font-size:22px;padding-left:4px}
.pill.timer.low{background:rgba(199,46,58,.75)}
/* last 30 seconds: red glow at the screen edges pulses with the clock; the timer beats, then shakes */
#danger{position:fixed;inset:0;z-index:6;pointer-events:none;opacity:0;
  background:radial-gradient(ellipse 75% 65% at 50% 50%,rgba(255,40,60,0) 55%,rgba(255,40,60,.45) 85%,rgba(255,30,50,.8) 100%)}
#danger.beat{animation:dz .9s ease-out forwards}
@keyframes dz{0%{opacity:var(--dz,.5)}100%{opacity:calc(var(--dz,.5)*.15)}}
.pill.timer.beat{animation:tbeat .45s ease-out}
@keyframes tbeat{0%{transform:scale(1.18)}100%{transform:scale(1)}}
.pill.timer.shake{animation:tshake .45s ease-in-out}
@keyframes tshake{0%,100%{transform:translateX(0) scale(1.15)}20%{transform:translateX(-4px) rotate(-4deg) scale(1.12)}40%{transform:translateX(4px) rotate(4deg)}60%{transform:translateX(-3px) rotate(-3deg)}80%{transform:translateX(2px)}}
.bar.low i{animation:barflash .5s ease-in-out infinite alternate}
@keyframes barflash{to{filter:brightness(1.5)}}
@media (prefers-reduced-motion:reduce){#danger.on{opacity:.35}}
.bar{height:7px;border-radius:7px;background:rgba(28,11,85,.55);overflow:hidden;margin:4px 6px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#FFE27A,var(--gold),var(--gold-deep));border-radius:7px;transition:width .25s linear}
.bar.low i{background:linear-gradient(90deg,#FF8A8E,var(--red))}
.pchip{display:flex;justify-content:center;padding:6px 0 2px}
.pchip span{font-size:13px;font-weight:600;color:#fff;background:rgba(28,11,85,.55);padding:3px 12px;border-radius:999px;font-variant-numeric:tabular-nums;backdrop-filter:blur(4px)}
.pchip b{color:var(--gold);font-weight:800}

/* Board */
#boardArea{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
#cv{position:absolute;inset:0;display:block;touch-action:none}

/* Praise toast: chunky outlined cartoon text */
#praise{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%) rotate(-3deg) scale(.6);opacity:0;pointer-events:none;text-align:center;transition:transform .35s cubic-bezier(.34,1.7,.64,1),opacity .2s!important;
  background:linear-gradient(180deg,var(--v1),var(--v3));border:3px solid var(--gold);border-radius:24px;padding:12px 22px 14px;min-width:min(300px,92%);max-width:94%;box-shadow:0 8px 0 var(--v-ink),0 18px 30px rgba(0,0,0,.35)}
#praise.on{opacity:1;transform:translate(-50%,-50%) rotate(-3deg) scale(1)}
#praise .ar{font-family:var(--f-arab-fun);font-weight:800;font-size:36px;color:var(--gold);line-height:1.35;direction:rtl;text-shadow:0 3px 0 #7A4D0F,0 6px 14px rgba(0,0,0,.35)}
#praise .tr{font-family:var(--f-display);font-size:27px;line-height:1.1;color:#fff;letter-spacing:.4px;-webkit-text-stroke:6px var(--v-ink);paint-order:stroke fill;text-shadow:0 4px 0 rgba(0,0,0,.3)}
#praise .mn{font-size:13px;font-weight:600;color:var(--muted);margin-top:2px}

/* small toast above everything (home screen messages) */
#toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translate(-50%,-20px);opacity:0;z-index:60;pointer-events:none;
  background:var(--v-ink);border:2px solid var(--gold);color:#fff;font-weight:700;padding:10px 18px;border-radius:16px;transition:.25s;max-width:90%;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* Dock: glossy 3D tool buttons */
.dock{display:flex;justify-content:center;align-items:flex-end;gap:10px;padding-block:8px calc(12px + env(safe-area-inset-bottom,0px))}
.tool{position:relative;width:62px;height:62px;border:0;border-radius:20px;padding:0;display:grid;place-items:center;
  background:linear-gradient(180deg,#FFFFFF,#E6DEFF);box-shadow:0 5px 0 #A99BE0,0 9px 14px rgba(0,0,0,.3);transition:transform .08s}
.tool:active{transform:translateY(3px);box-shadow:0 2px 0 #A99BE0,0 4px 8px rgba(0,0,0,.3)}
.tool img{width:44px;height:44px}
.tool svg{width:26px;height:26px;color:var(--v3)}
.tool.sm{width:50px;height:50px;border-radius:16px;background:linear-gradient(180deg,var(--v1),var(--v2));box-shadow:0 5px 0 var(--v-ink),0 9px 14px rgba(0,0,0,.3)}
.tool.sm svg{color:#fff;width:28px;height:28px}
.tool .n{position:absolute;top:-7px;right:-7px;min-width:26px;height:26px;padding:0 6px;border-radius:13px;background:var(--red);border:2px solid #fff;
  font-family:var(--f-display);font-size:15px;line-height:22px;color:#fff;font-variant-numeric:tabular-nums}
.tool:disabled{filter:grayscale(1);opacity:.55}

/* Overlays */
.ov{position:fixed;inset:0;z-index:20;display:grid;place-items:center;overflow:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch;padding:max(56px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));
  background:rgba(28,11,85,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.ov.lock{z-index:40;background:rgba(28,11,85,.8)}
.card{position:relative;width:100%;max-width:400px;background:linear-gradient(180deg,var(--v1) 0%,var(--v2) 55%,var(--v3) 100%);
  border:3px solid rgba(255,255,255,.28);border-radius:30px;padding:74px 20px 22px;text-align:center;display:flex;flex-direction:column;gap:12px;
  box-shadow:0 10px 0 var(--v-ink),0 24px 40px rgba(0,0,0,.4)}
.card.plain{padding-top:22px}
.ribbon{position:absolute;left:50%;top:-40px;transform:translateX(-50%);width:min(300px,92%);aspect-ratio:720/264;display:grid;place-items:center;pointer-events:none}
.ribbon img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.ribbon span{position:relative;top:-9%;font-family:var(--f-display);font-size:23px;color:#fff;letter-spacing:.5px;-webkit-text-stroke:5px rgba(60,10,10,.55);paint-order:stroke fill;text-shadow:0 3px 0 rgba(0,0,0,.25);white-space:nowrap}
.ribbon.green span{-webkit-text-stroke-color:rgba(10,60,20,.55)}
.ribbon span{display:none}
.ribbon .rtext{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.ribbon .rtext text{font-family:var(--f-display);font-size:58px;letter-spacing:1px;fill:#fff;stroke:rgba(90,12,12,.7);stroke-width:13px;stroke-linejoin:round;paint-order:stroke fill}
.ribbon.green .rtext text{stroke:rgba(10,70,20,.7)}
.card h1{margin:0;font-family:var(--f-display);font-size:46px;font-weight:400;color:var(--gold);letter-spacing:1px;line-height:1;-webkit-text-stroke:7px var(--v-ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--v-ink)}
.card h2{margin:0;font-family:var(--f-display);font-size:28px;font-weight:400;letter-spacing:.4px;text-wrap:balance;-webkit-text-stroke:5px var(--v-ink);paint-order:stroke fill}
.card p{margin:0;color:var(--muted);font-size:15px;font-weight:600;line-height:1.5;text-wrap:balance}
.ar-big{font-family:var(--f-arab);font-weight:800;font-size:31px;line-height:1.7;color:var(--gold);direction:rtl;text-shadow:0 2px 0 rgba(0,0,0,.3)}
.btn{border:0;border-radius:20px;padding:14px 18px;font-family:var(--f-display);font-size:22px;letter-spacing:.6px;color:#fff;
  background:linear-gradient(180deg,#7DF08F,var(--green));box-shadow:0 6px 0 var(--green-deep),0 10px 16px rgba(0,0,0,.25);text-shadow:0 2px 0 rgba(0,0,0,.25);transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--green-deep)}
.btn:disabled{background:#8E86B5;box-shadow:0 6px 0 #5E5690;text-shadow:none}
.btn.ghost{background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.3);box-shadow:0 4px 0 rgba(28,11,85,.6);font-size:19px;padding:11px 16px}
.btn.gold{background:linear-gradient(180deg,#FFE27A,var(--gold));color:#5A3200;text-shadow:none;box-shadow:0 6px 0 var(--gold-deep),0 10px 16px rgba(0,0,0,.25)}
.btn.gold:disabled{background:#8E86B5;color:#E8E4FF;box-shadow:0 6px 0 #5E5690}
.row{display:flex;gap:10px}.row>*{flex:1}
.hero{width:150px;height:150px;margin:-6px auto -4px;object-fit:contain;filter:drop-shadow(0 10px 14px rgba(0,0,0,.35));animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-2deg)}}
.rate{display:flex;justify-content:center;align-items:flex-end;gap:4px;height:62px}
.rate img{width:52px;height:52px;filter:drop-shadow(0 4px 4px rgba(0,0,0,.3));transform:scale(0);animation:pop .45s cubic-bezier(.34,1.7,.64,1) forwards}
.rate img{animation-delay:.6s}.rate img:nth-child(2){width:62px;height:62px;animation-delay:.78s}.rate img:nth-child(3){animation-delay:.96s}
.rate img.off{filter:grayscale(1) brightness(.55);opacity:.6}
/* level complete: rotating sunburst behind the trophy, a big faint one behind the card, confetti on top */
#ovWin .card>*:not(.ribbon){position:relative;z-index:1}
#ovWin .card>.hero-wrap{z-index:0}
.hero-wrap{width:150px;height:150px;margin:-6px auto -4px}
.hero-wrap .hero{position:relative;z-index:2;margin:0;animation:heroIn .7s cubic-bezier(.34,1.7,.64,1) .45s both,bob 2.4s ease-in-out 1.2s infinite}
@keyframes heroIn{0%{transform:scale(0) rotate(-25deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
.sunburst,.glow{position:absolute;left:50%;top:50%;pointer-events:none;border-radius:50%}
.sunburst{width:360px;height:360px;margin:-180px 0 0 -180px;
  background:repeating-conic-gradient(from 0deg,rgba(255,226,122,.85) 0deg 8deg,rgba(255,226,122,0) 8deg 20deg);
  -webkit-mask:radial-gradient(circle,#000 14%,rgba(0,0,0,.55) 38%,transparent 66%);mask:radial-gradient(circle,#000 14%,rgba(0,0,0,.55) 38%,transparent 66%);
  animation:burstIn .6s ease-out .35s both,spin 10s linear infinite}
.glow{width:230px;height:230px;margin:-115px 0 0 -115px;z-index:1;background:radial-gradient(circle,rgba(255,246,200,.95) 0%,rgba(255,201,60,.45) 35%,rgba(255,201,60,0) 68%);animation:burstIn .6s ease-out .35s both,glowPulse 1.6s ease-in-out infinite alternate}
@keyframes spin{to{rotate:360deg}}
@keyframes burstIn{0%{scale:0;opacity:0}100%{scale:1;opacity:1}}
@keyframes glowPulse{to{transform:scale(1.12);opacity:.8}}
#ovWin .fx{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.rewards{display:flex;justify-content:center;gap:10px;margin-top:-2px}
.rw{position:relative;flex:1;max-width:150px;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;align-items:center;column-gap:8px;text-align:left;
  background:rgba(28,11,85,.55);border:2px solid rgba(255,255,255,.22);border-radius:18px;padding:6px 12px 6px 8px;box-shadow:inset 0 2px 0 rgba(255,255,255,.08);
  animation:rwIn .5s cubic-bezier(.34,1.7,.64,1) both}
.rw-s{animation-delay:1.1s;border-color:rgba(255,201,60,.6)}.rw-t{animation-delay:1.3s;border-color:rgba(46,196,214,.6)}
@keyframes rwIn{0%{transform:scale(0) rotate(-6deg)}100%{transform:none}}
.rw img{grid-row:1/3;width:40px;height:40px;filter:drop-shadow(0 3px 3px rgba(0,0,0,.35));animation:bob 2.2s ease-in-out 1.8s infinite}
.rw b{font-family:var(--f-display);font-weight:400;font-size:26px;line-height:1;color:var(--gold);-webkit-text-stroke:5px var(--v-ink);paint-order:stroke fill;font-variant-numeric:tabular-nums}
.rw-t b{color:#7FE7F2}
.rw small{font-size:11.5px;font-weight:800;color:var(--muted);line-height:1.1}
.rw b.pop{animation:numPop .25s ease-out}
@keyframes numPop{50%{transform:scale(1.3)}}
#ovWin .bigburst{position:absolute;left:50%;top:40%;width:180vmax;height:180vmax;margin:-90vmax 0 0 -90vmax;border-radius:50%;
  background:repeating-conic-gradient(from 0deg,rgba(255,236,170,.16) 0deg 7deg,rgba(255,236,170,0) 7deg 16deg);animation:spin 45s linear infinite reverse}
#confetti{position:fixed;inset:0;width:100%;height:100%;z-index:30;pointer-events:none}
@keyframes pop{to{transform:scale(1)}}
.gift{display:flex;align-items:center;justify-content:center;gap:10px;background:rgba(28,11,85,.4);border-radius:16px;padding:8px 12px;font-weight:700}
.gift img{width:46px;height:46px}
.count{font-variant-numeric:tabular-nums;font-size:15px;font-weight:700;color:var(--muted)}

/* Home */
.home{width:100%;max-width:440px;display:flex;flex-direction:column;gap:10px;text-align:center;margin-top:-30px}
.logo .ar{font-family:var(--f-arab-fun);font-weight:800;font-size:30px;color:var(--gold);line-height:1;text-shadow:0 3px 0 var(--v-ink)}
.logo h1{margin:0;font-family:var(--f-display);font-weight:400;font-size:50px;line-height:1;color:#fff;letter-spacing:1px;-webkit-text-stroke:9px var(--v-ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--v-ink),0 12px 24px rgba(0,0,0,.35);transform:rotate(-2deg)}
.logo h1 em{font-style:normal;color:var(--gold)}
.logo p{margin:4px 0 0;font-weight:700;font-size:14px;line-height:1.3;color:#fff;text-shadow:0 2px 6px rgba(28,11,85,.9)}
.statline{display:flex;justify-content:center;gap:10px}
.worlds{display:grid;grid-template-columns:repeat(4,1fr);gap:6px 4px;background:rgba(28,11,85,.5);border:2px solid rgba(255,255,255,.18);border-radius:24px;padding:8px 10px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.world{position:relative;border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:2px}
.world img{width:100%;max-width:80px;aspect-ratio:1;object-fit:contain;filter:drop-shadow(0 5px 6px rgba(0,0,0,.35));transition:transform .15s}
.world:active img{transform:scale(.94)}
.world b{font-family:var(--f-display);font-weight:400;font-size:12.5px;letter-spacing:.2px;line-height:1.1;min-height:2.2em;display:flex;align-items:center}
.world small{font-size:11.5px;font-weight:700;color:var(--muted);line-height:1}
.world.locked img{filter:grayscale(.9) brightness(.6) drop-shadow(0 5px 6px rgba(0,0,0,.35))}
.world.locked::after{content:'';position:absolute;top:14%;left:50%;width:28px;height:28px;transform:translateX(-50%);
  background:url(assets/ui/padlock.webp) center/contain no-repeat;filter:drop-shadow(0 3px 3px rgba(0,0,0,.4))}
.world.cur img{animation:bob 2.4s ease-in-out infinite}
.sched-box{background:rgba(28,11,85,.5);border:2px solid rgba(255,255,255,.18);border-radius:20px;padding:10px;display:flex;flex-direction:column;gap:6px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.sched-box label{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.8px}
.sched{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.sched div{background:rgba(255,255,255,.08);border-radius:12px;padding:5px 2px;display:flex;flex-direction:column;align-items:center;border:2px solid transparent}
.sched .now{border-color:var(--gold);background:rgba(255,201,60,.15)}
.sched small{font-size:11px;font-weight:700;color:var(--muted)}
.sched b{font-family:var(--f-display);font-weight:400;font-size:16px;font-variant-numeric:tabular-nums;letter-spacing:.3px}
.sched .ck{font-size:11px;color:var(--ok);height:12px;line-height:12px}
.meta{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.2px}
.homebar{display:flex;gap:10px;align-items:center}
.homebar .btn{flex:1}

/* Settings */
.field{display:flex;flex-direction:column;gap:6px;text-align:left}
.field label{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.8px}
.field select,.field input{background:var(--v-ink);color:#fff;border:2px solid rgba(255,255,255,.18);border-radius:14px;padding:10px 12px;font:inherit;font-weight:700;width:100%}
.seg{display:flex;background:var(--v-ink);border:2px solid rgba(255,255,255,.14);border-radius:14px;padding:3px}
.seg button{flex:1;border:0;background:transparent;padding:7px;border-radius:10px;font-weight:800;font-size:14px}
.seg button.on{background:linear-gradient(180deg,#FFE27A,var(--gold));color:#5A3200}
/* picture icons so children who cannot read yet still know each button (mask, coloured by currentColor) */
.btn[data-ic],.seg button[data-ic]{display:flex;align-items:center;justify-content:center;gap:10px}
[data-ic]::before{content:'';flex:none;width:1.3em;height:1.3em;background:currentColor;-webkit-mask:var(--ic) center/contain no-repeat;mask:var(--ic) center/contain no-repeat}
.btn[data-ic]::before{width:1.45em;height:1.45em;filter:drop-shadow(0 2px 0 rgba(0,0,0,.2))}
.field label[data-ic]{display:flex;align-items:center;gap:6px}.field label[data-ic]::before{width:18px;height:18px}
[data-ic="music"]{--ic:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22%3E%3Cpath d=%22M9 17.5V5.2l11-2.2v11.8%22 fill=%22none%22 stroke=%22%23000%22 stroke-width=%222.4%22 stroke-linejoin=%22round%22/%3E%3Ccircle cx=%226.4%22 cy=%2217.6%22 r=%223.2%22/%3E%3Ccircle cx=%2217.4%22 cy=%2215%22 r=%223.2%22/%3E%3C/svg%3E")}

/* ===== v2: combo meter, goal bar, quake, gate tip ===== */
.meter{height:5px;margin:3px 30% 0;border-radius:5px;background:rgba(28,11,85,.5);overflow:hidden}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#B37BFF,#FF7AB6,#FFC93C);border-radius:5px;transition:width .3s}
.goalbar{display:flex;justify-content:center;align-items:center;gap:8px;margin:5px auto 0;padding:3px 10px;border-radius:999px;background:rgba(28,11,85,.65);border:2px solid rgba(255,201,60,.6);width:max-content;max-width:94%}
.goalbar .gl{font-family:var(--f-display);font-size:14px;color:var(--gold)}
.goalbar .gi{display:flex;align-items:center;gap:3px;font-family:var(--f-display);font-size:16px}
.goalbar .gi img{width:28px;height:28px}.goalbar .gi.done b{color:var(--ok)}
.goalbar .gi.pop{animation:numPop .3s}
#boardArea.quake{animation:quake .5s}
@keyframes quake{10%,50%,90%{transform:translate(-6px,3px)}30%,70%{transform:translate(6px,-3px)}}
.tip{display:flex;align-items:center;gap:10px;text-align:left;background:rgba(28,11,85,.5);border:2px solid rgba(255,201,60,.55);border-radius:16px;padding:8px 12px;font-weight:700;font-size:14px;line-height:1.3}
.tip i{font-style:normal;font-size:30px;flex:none;animation:bob 2s ease-in-out infinite}
/* ===== v2: world screen hub, progress ===== */
.pk-mid{display:flex;gap:6px;align-items:center}.pill.streak{font-size:16px;padding:0 12px;gap:4px}
.hub{width:100%;display:flex;gap:8px;padding:0 4px}
.hubb{position:relative;flex:1;display:flex;align-items:center;gap:8px;border:0;border-radius:18px;padding:8px 10px;text-align:left;color:#fff;
  background:linear-gradient(180deg,#FFB347,#F07C1E);box-shadow:0 5px 0 #A9480B,0 9px 14px rgba(0,0,0,.3)}
.hubb+.hubb{background:linear-gradient(180deg,#5FD6E8,#1E9BB8);box-shadow:0 5px 0 #0E6276,0 9px 14px rgba(0,0,0,.3)}
.hubb:active{transform:translateY(3px)}
.hubb i{font-style:normal;font-size:28px}.hubb span{display:flex;flex-direction:column;min-width:0}
.hubb b{font-family:var(--f-display);font-weight:400;font-size:16px;line-height:1.05;-webkit-text-stroke:3px rgba(0,0,0,.25);paint-order:stroke fill}
.hubb small{font-size:11px;font-weight:800;opacity:.95;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hubb.done{filter:saturate(.6)}
.hubb .dot{position:absolute;top:-4px;right:-4px;width:16px;height:16px;border-radius:50%;background:var(--red);border:2px solid #fff;animation:pulse 1.2s infinite}
.wprog{width:66%;height:6px;border-radius:6px;background:rgba(28,11,85,.6);overflow:hidden;margin-top:1px}.wprog i{display:block;height:100%;background:linear-gradient(90deg,#FFE27A,var(--gold))}
.wb .wnum{font-size:11px;font-weight:800;color:var(--muted);line-height:1.1}
.wb .lv.cup{background:linear-gradient(180deg,#FFE27A,var(--gold))}
/* ===== v2: world map ===== */
#ovMap,#ovAlbum{display:flex;justify-content:center;padding-top:max(14px,env(safe-area-inset-top,0px));padding-bottom:max(10px,env(safe-area-inset-bottom,0px));overflow:hidden}
#ovMap .pick,#ovAlbum .pick{height:auto;align-self:stretch;min-height:0}
.map-head{display:flex;align-items:center;gap:8px}
.map-head img{width:58px;height:58px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.4))}
.map-head h1{margin:0;font-family:var(--f-display);font-weight:400;font-size:min(8vw,32px);color:var(--gold);-webkit-text-stroke:7px var(--v-ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--v-ink)}
.map-head i{font-style:normal;font-size:30px;animation:bob 2s infinite}
.map{position:relative;width:100%}
.mpath{position:absolute;left:0;top:0;width:100%;pointer-events:none}
.mpath polyline{fill:none;stroke:rgba(255,255,255,.55);stroke-width:1.6;stroke-dasharray:.1 3.2;stroke-linecap:round;vector-effect:non-scaling-stroke;stroke-width:9px}
.node{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;border:4px solid #fff;padding:0;display:grid;place-items:center;
  background:radial-gradient(circle at 35% 30%,#9C7BFF,#5A2FE0 70%);box-shadow:0 6px 0 var(--v-ink),0 10px 16px rgba(0,0,0,.35);color:#fff}
.node b{font-family:var(--f-display);font-weight:400;font-size:26px;-webkit-text-stroke:4px var(--v-ink);paint-order:stroke fill}
.node.done{background:radial-gradient(circle at 35% 30%,#FFE98A,#F2A40C 70%)}
.node.hard{border-color:#FF9F9F}
.node.boss{width:84px;height:84px;margin:-42px 0 0 -42px;border-width:5px;border-color:var(--gold);background:radial-gradient(circle at 35% 30%,#FF8A8E,#C72E3A 70%)}
.node.boss.done{background:radial-gradient(circle at 35% 30%,#FFE98A,#F2A40C 70%)}
.node .crown{position:absolute;top:-26px;font-style:normal;font-size:28px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.4))}
.node.lock{background:radial-gradient(circle at 35% 30%,#8E86B5,#4E4683 70%);border-color:rgba(255,255,255,.5)}
.node.lock b{font-size:20px;-webkit-text-stroke:0}
.node.cur{background:radial-gradient(circle at 35% 30%,#8CF59C,#2FB24A 70%);animation:bob 1.6s ease-in-out infinite}
.node.cur::after{content:'';position:absolute;inset:-12px;border-radius:50%;border:4px solid rgba(140,245,156,.8);animation:ring 1.4s ease-out infinite}
@keyframes ring{from{transform:scale(.8);opacity:1}to{transform:scale(1.35);opacity:0}}
.node .ns{position:absolute;bottom:-17px;display:flex;gap:0}.node .ns img{width:18px;height:18px}.node .ns img.off{filter:grayscale(1) brightness(.6);opacity:.7}
/* ===== v2: daily gift ===== */
.gdays{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.gd{display:flex;flex-direction:column;align-items:center;gap:1px;background:rgba(28,11,85,.45);border:2px solid rgba(255,255,255,.18);border-radius:14px;padding:5px 2px}
.gd small{font-size:11px;font-weight:800;color:var(--muted)}.gd img{width:30px;height:30px}.gd b{font-family:var(--f-display);font-weight:400;font-size:14px}
.gd.got{opacity:.45}.gd.got::after{content:'✓';position:absolute}
.gd.today{border-color:var(--gold);background:rgba(255,201,60,.22);animation:pulse 1.2s ease-in-out infinite}
.gd.big{grid-column:span 1}
/* ===== v2: sticker book ===== */
#bPack{width:94%}
.alb{background:rgba(28,11,85,.5);border:2px solid rgba(255,255,255,.18);border-radius:18px;padding:8px;margin:0 4px 10px}
.alb header{display:flex;align-items:center;gap:8px;margin-bottom:6px}.alb header img{width:36px;height:36px}
.alb header b{flex:1;font-family:var(--f-display);font-weight:400;font-size:16px}.alb header span{font-weight:800;font-size:13px;color:var(--gold)}
.agrid{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.agrid i{aspect-ratio:1;border-radius:10px;background:#FFF7E6;display:grid;place-items:center;box-shadow:0 2px 0 #C49A5C}
.agrid i img{width:86%;height:86%;object-fit:contain}
.agrid i.miss{background:rgba(255,255,255,.08);box-shadow:none}.agrid i.miss img{filter:brightness(0);opacity:.25}
.alb.locked{opacity:.6}.alock{margin:0;font-size:13px;font-weight:700;color:var(--muted)}
.packov{position:absolute;inset:0;z-index:5;background:rgba(28,11,85,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px}
.packcards{display:flex;gap:10px}
.pcard{width:100px;height:136px;border-radius:16px;background:linear-gradient(180deg,#FFF7E6,#FFE3B0);border:4px solid var(--gold);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  box-shadow:0 8px 0 #B8860B,0 14px 24px rgba(0,0,0,.4);animation:flipIn .6s cubic-bezier(.34,1.56,.64,1) calc(.6s + var(--d)) both}
.pcard img{width:72px;height:72px}.pcard b{font-family:var(--f-display);font-weight:400;font-size:15px;color:#8A4B00}.pcard b.new{color:#fff;background:var(--red);border-radius:8px;padding:0 6px}
@keyframes flipIn{0%{transform:rotateY(90deg) scale(.6);opacity:0}100%{transform:none;opacity:1}}
/* ===== Scene 1: intro ===== */
body.menu #app{visibility:hidden}
.ov.intro{background:#5BC4F5;backdrop-filter:none;-webkit-backdrop-filter:none;padding:0;
  overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:3vh;padding-top:calc(9vh + env(safe-area-inset-top,0px))}
.introbg{position:absolute;inset:0;background:url(assets/bg/intro.webp) center bottom/cover no-repeat;animation:bgZoom 18s ease-in-out infinite alternate}
@keyframes bgZoom{from{transform:scale(1)}to{transform:scale(1.05)}}
.logo3{position:relative;z-index:3;width:min(92vw,430px);animation:logoIn 1s cubic-bezier(.34,1.56,.64,1) .2s both}
.logo3 .l-img{position:relative;z-index:1;display:block;width:100%;filter:drop-shadow(0 10px 14px rgba(0,40,90,.35));animation:logoFloat 3.2s ease-in-out 1.3s infinite}
@keyframes logoIn{0%{transform:translateY(-70vh) scale(.6) rotate(-8deg)}60%{transform:translateY(12px) scale(1.06,.92)}80%{transform:translateY(-6px) scale(.98,1.03)}100%{transform:none}}
@keyframes logoFloat{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-10px) rotate(1deg)}}
.l-rays{position:absolute;left:50%;top:48%;width:150%;aspect-ratio:1;translate:-50% -50%;border-radius:50%;z-index:0;pointer-events:none;
  background:repeating-conic-gradient(rgba(255,255,255,.5) 0deg 9deg,rgba(255,255,255,0) 9deg 22deg);
  -webkit-mask:radial-gradient(circle,#000 18%,transparent 64%);mask:radial-gradient(circle,#000 18%,transparent 64%);animation:fadeIn .8s ease 1s both,spin 24s linear infinite}
.l-shine{position:absolute;inset:0;z-index:2;pointer-events:none;-webkit-mask:url(assets/ui/logo.webp) center/100% 100% no-repeat;mask:url(assets/ui/logo.webp) center/100% 100% no-repeat;
  background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.75) 48%,transparent 60%) no-repeat;background-size:250% 100%;animation:shine 4s ease-in-out 1.6s infinite}
@keyframes shine{0%{background-position:150% 0}35%,100%{background-position:-60% 0}}
.playimg{position:relative;z-index:3;border:0;background:none;padding:0;width:min(66vw,290px);animation:popIn .6s cubic-bezier(.34,1.7,.64,1) 1.2s both,pulse 1.6s ease-in-out 2s infinite}
.playimg img{display:block;width:100%;filter:drop-shadow(0 8px 10px rgba(0,60,0,.35))}
.playimg:active img{transform:translateY(4px) scale(.97)}
.ov.intro.leave{animation:introOut .45s ease-in forwards}
@keyframes introOut{to{opacity:0;transform:scale(1.08)}}
.clouds i{position:absolute;display:block;background:#fff;border-radius:999px;opacity:.85;filter:blur(1px);box-shadow:0 0 30px rgba(255,255,255,.8)}
.clouds i::before,.clouds i::after{content:'';position:absolute;background:#fff;border-radius:50%}
.clouds i{z-index:1}.clouds i:nth-child(1){top:7%;left:-30%;width:150px;height:46px;animation:drift 38s linear infinite}
.clouds i:nth-child(2){top:16%;left:-40%;width:110px;height:34px;animation:drift 52s linear -20s infinite;opacity:.7}
.clouds i:nth-child(3){top:30%;left:-30%;width:180px;height:52px;animation:drift 64s linear -40s infinite;opacity:.6}
.clouds i::before{width:55%;height:120%;left:15%;top:-55%}.clouds i::after{width:40%;height:95%;left:48%;top:-35%}
@keyframes drift{to{transform:translateX(170vw)}}
@keyframes fadeIn{to{opacity:1}}
.spark{position:absolute;width:26px;height:26px;opacity:0;animation:twinkle 1.8s ease-in-out infinite}
.spark{z-index:3}.s1{left:-2%;top:62%;animation-delay:1.8s}.s2{right:0;top:8%;animation-delay:2.4s;width:34px;height:34px}.s3{left:6%;top:4%;animation-delay:3s;width:22px;height:22px}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.3) rotate(0)}50%{opacity:1;transform:scale(1) rotate(30deg)}}
@keyframes popIn{0%{transform:scale(0)}100%{transform:scale(1)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.copy{position:absolute;left:0;right:0;bottom:calc(8px + env(safe-area-inset-bottom,0px));text-align:center;font-size:11.5px;font-weight:700;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.8),0 0 8px rgba(0,60,0,.6);z-index:4;letter-spacing:.2px}

/* music on/off button (shown on every screen) */
.mbtn{flex:none;width:38px;height:38px;border-radius:50%;border:2px solid rgba(255,255,255,.3);padding:0;display:grid;place-items:center;
  background:linear-gradient(180deg,var(--v1),var(--v2));color:#fff;box-shadow:0 3px 0 var(--v-ink)}
.mbtn svg{width:20px;height:20px}.mbtn .x{display:none}
.mbtn.off{background:linear-gradient(180deg,#9A93BF,#6E6698)}.mbtn.off .x{display:block}
.mbtn:not(.off) svg{animation:note 1s ease-in-out infinite alternate}
@keyframes note{to{transform:rotate(-10deg) scale(1.08)}}
.mbtn.big{width:48px;height:48px;border-radius:16px;border:0;box-shadow:0 5px 0 var(--v-ink),0 9px 14px rgba(0,0,0,.3)}
.mbtn.big svg{width:26px;height:26px}
.mbtn.corner{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:12px;z-index:5}
.powers{display:flex;justify-content:center;gap:14px;padding-top:4px}
.pw{position:relative;display:flex;align-items:center;gap:6px;border:3px solid #fff;border-radius:999px;padding:4px 14px 4px 8px;color:#fff;
  background:linear-gradient(180deg,#FF8AD8,#B04BD6);box-shadow:0 4px 0 #6E1F8E,0 8px 12px rgba(0,0,0,.3)}
.pw+.pw{background:linear-gradient(180deg,#8FE3FF,#2E8FE0);box-shadow:0 4px 0 #134F8A,0 8px 12px rgba(0,0,0,.3)}
.pw i{font-style:normal;font-size:24px;line-height:1}.pw b{font-family:var(--f-display);font-weight:400;font-size:20px;-webkit-text-stroke:3px rgba(0,0,0,.3);paint-order:stroke fill}
.pw:active{transform:translateY(3px)}.pw:disabled{filter:grayscale(1);opacity:.5}
.pw.new{animation:pwNew .6s cubic-bezier(.34,1.7,.64,1)}@keyframes pwNew{0%{transform:scale(.4)}100%{transform:none}}
.pill.timer.frozen{background:linear-gradient(180deg,#8FE3FF,#2E8FE0)}
.stys{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sty{display:flex;flex-direction:column;align-items:center;gap:2px;border:3px solid rgba(255,255,255,.35);border-radius:20px;padding:10px 4px 8px;color:#fff;
  background:linear-gradient(180deg,var(--c1),var(--c2));box-shadow:0 5px 0 var(--c3),0 9px 14px rgba(0,0,0,.3);animation:rwIn .45s cubic-bezier(.34,1.7,.64,1) both;animation-delay:calc(var(--i)*.08s)}
.sty:active{transform:translateY(3px)}.sty.on{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold),0 5px 0 var(--c3)}
.sty i{font-style:normal;font-size:46px;line-height:1.1;animation:bob 2.4s ease-in-out infinite}
.sty b{font-family:var(--f-display);font-weight:400;font-size:19px;-webkit-text-stroke:4px rgba(0,0,0,.25);paint-order:stroke fill}
.sty small{font-weight:800;font-size:12px;opacity:.95}.sty em{font-style:normal;font-size:11px;font-weight:700;opacity:.85}
.hud-r,.pk-r{display:flex;align-items:center;gap:6px}
/* ===== Scene 2: choose a world ===== */
.pick{width:100%;max-width:460px;height:100%;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative}
#ovHome{display:flex;justify-content:center;padding-top:max(14px,env(safe-area-inset-top,0px));padding-bottom:max(10px,env(safe-area-inset-bottom,0px));overflow:hidden}
#ovHome .pick{height:auto;align-self:stretch;min-height:0}
.pk-top{width:100%;display:flex;justify-content:space-between;align-items:center}
.pk-top .tool.sm{width:48px;height:48px}
.pk-title{margin:2px 0 0;font-family:var(--f-display);font-weight:400;font-size:min(10vw,42px);line-height:1;color:var(--gold);-webkit-text-stroke:8px var(--v-ink);paint-order:stroke fill;
  text-shadow:0 5px 0 var(--v-ink),0 10px 18px rgba(0,0,0,.35);transform:rotate(-2deg);text-transform:uppercase;text-align:center}
.pk-scroll{flex:1;min-height:0;width:100%;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;-webkit-overflow-scrolling:touch;
  -webkit-mask:linear-gradient(transparent,#000 16px,#000 calc(100% - 26px),transparent);mask:linear-gradient(transparent,#000 16px,#000 calc(100% - 26px),transparent);scrollbar-width:none}
.pk-scroll::-webkit-scrollbar{display:none}
.pk-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px 6px;padding:14px 4px 30px}
.wb{position:relative;border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:1px;color:#fff;animation:wbIn .45s cubic-bezier(.34,1.56,.64,1) both;animation-delay:calc(var(--i)*35ms)}
@keyframes wbIn{0%{opacity:0;transform:scale(.6) translateY(20px)}100%{opacity:1;transform:none}}
.wb>img{width:100%;max-width:118px;aspect-ratio:1;object-fit:contain;filter:drop-shadow(0 6px 8px rgba(0,0,0,.4));transition:transform .12s}
.wb:active>img{transform:scale(.92)}
.wb.cur>img{animation:bob 2.4s ease-in-out infinite;filter:drop-shadow(0 0 12px rgba(255,201,60,.9)) drop-shadow(0 6px 8px rgba(0,0,0,.4))}
.wb b{font-family:var(--f-display);font-weight:400;font-size:13.5px;line-height:1.05;letter-spacing:.3px;-webkit-text-stroke:4px var(--v-ink);paint-order:stroke fill;text-align:center;min-height:2.1em;display:flex;align-items:center}
.wb .st{display:flex;gap:1px;margin-top:-2px}.wb .st img{width:12px;height:12px}.wb .st img.off{filter:grayscale(1) brightness(.6);opacity:.55}
.wb .lv{position:absolute;top:2%;right:6%;background:linear-gradient(180deg,#FF8A8E,var(--red));border:2px solid #fff;border-radius:10px;padding:0 6px;font-family:var(--f-display);font-size:13px;line-height:1.4;box-shadow:0 2px 0 rgba(0,0,0,.25);transform:rotate(8deg)}
.wb.soon{pointer-events:auto}.wb.soon>img{filter:saturate(.35) brightness(.75) drop-shadow(0 6px 8px rgba(0,0,0,.35))}
.wb .soontag{font-size:11px;font-weight:800;color:var(--gold);letter-spacing:.4px;text-transform:uppercase;margin-top:-2px}
.wb.soon::after{content:'';position:absolute;top:14%;left:50%;width:42%;aspect-ratio:1;translate:-50% 0;background:url(assets/ui/padlock.webp) center/contain no-repeat;filter:drop-shadow(0 3px 3px rgba(0,0,0,.4))}
.wb.soon b{color:var(--muted)}
.praychip{display:flex;align-items:center;gap:6px;border:2px solid rgba(255,255,255,.22);background:rgba(28,11,85,.65);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  border-radius:999px;padding:5px 14px;font-size:12.5px;font-weight:700;color:#fff;max-width:94%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.praychip b{color:var(--gold);font-weight:800}
.schedpop{position:absolute;left:8px;right:8px;bottom:46px;z-index:6;background:linear-gradient(180deg,var(--v1),var(--v3));border:3px solid rgba(255,255,255,.28);border-radius:20px;padding:10px;box-shadow:0 8px 0 var(--v-ink),0 16px 30px rgba(0,0,0,.4);display:flex;flex-direction:column;gap:6px}
.schedpop label{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;text-align:center}
@media (max-height:760px){.ov.intro{padding-top:calc(4vh + env(safe-area-inset-top,0px));gap:2vh}.logo3{width:min(76vw,330px)}.playimg{width:min(54vw,230px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-height:760px){.hero,.hero-wrap{width:110px;height:110px}.sunburst{width:280px;height:280px;margin:-140px 0 0 -140px}.logo h1{font-size:42px}.logo .ar{font-size:24px}.world img{max-width:62px}.world small{display:none}}
</style>
</head>
<body>

<div class="bg" id="bgA"></div><div class="bg" id="bgB"></div>

<div id="app">
  <div class="hud">
    <div class="pill" id="lvlPill"><span class="hash">#</span><span id="lvl">1</span></div>
    <div class="pill timer" id="timerPill"><img src="assets/ui/stopwatch.webp" alt=""><span id="time">0:00</span></div>
    <div class="hud-r"><div class="pill"><img src="assets/ui/star.webp" alt=""><span id="stars">0</span></div><button class="mbtn " id="mHud" aria-label="Music"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 17.5V5.2l11-2.2v11.8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/><circle cx="6.4" cy="17.6" r="3.2" fill="currentColor"/><circle cx="17.4" cy="15" r="3.2" fill="currentColor"/><path class="x" d="M3 3l18 18" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg></button></div>
  </div>
  <div class="bar" id="bar"><i id="barFill" style="width:100%"></i></div>
  <div class="meter" title="Combo power"><i id="meterFill"></i></div>
  <div class="goalbar" id="goalBar" hidden></div>
  <div class="pchip"><span id="pchip">—</span></div>
  <div id="boardArea">
    <canvas id="cv"></canvas>
    <div id="praise"><div class="ar"></div><div class="tr"></div><div class="mn"></div></div>
  </div>
  <div class="powers"><button class="pw" id="pwBurst" aria-label="Star Burst"><i>✨</i><b id="nBurst">0</b></button><button class="pw" id="pwFreeze" aria-label="Time Freeze"><i>❄️</i><b id="nFreeze">0</b></button></div>
  <div class="dock">
    <button class="tool sm" id="bPause" aria-label="Pause"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="5.5" y="4.5" width="4.6" height="15" rx="1.6"/><rect x="13.9" y="4.5" width="4.6" height="15" rx="1.6"/></svg></button>
    <button class="tool" id="bUndo" aria-label="Undo"><img src="assets/ui/undo.webp" alt=""><span class="n" id="nUndo">3</span></button>
    <button class="tool" id="bShuf" aria-label="Shuffle"><img src="assets/ui/shuffle.webp" alt=""><span class="n" id="nShuf">2</span></button>
    <button class="tool" id="bHint" aria-label="Hint"><img src="assets/ui/hint.webp" alt=""><span class="n" id="nHint">3</span></button>
    <button class="tool sm" id="bSet" aria-label="Settings"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M19.83 9.58 L22.78 9.81 L22.78 14.19 L19.83 14.42 L19.25 15.83 L21.17 18.08 L18.08 21.17 L15.83 19.25 L14.42 19.83 L14.19 22.78 L9.81 22.78 L9.58 19.83 L8.17 19.25 L5.92 21.17 L2.83 18.08 L4.75 15.83 L4.17 14.42 L1.22 14.19 L1.22 9.81 L4.17 9.58 L4.75 8.17 L2.83 5.92 L5.92 2.83 L8.17 4.75 L9.58 4.17 L9.81 1.22 L14.19 1.22 L14.42 4.17 L15.83 4.75 L18.08 2.83 L21.17 5.92 L19.25 8.17Z M15.4 12A3.4 3.4 0 1 0 8.6 12A3.4 3.4 0 1 0 15.4 12Z"/></svg></button>
  </div>
</div>

<!-- Scene 1: intro -->
<div class="ov intro" id="ovIntro">
  <div class="introbg"></div>
  <button class="mbtn big corner" id="mIntro" aria-label="Music"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 17.5V5.2l11-2.2v11.8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/><circle cx="6.4" cy="17.6" r="3.2" fill="currentColor"/><circle cx="17.4" cy="15" r="3.2" fill="currentColor"/><path class="x" d="M3 3l18 18" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg></button>
  <div class="clouds"><i></i><i></i><i></i></div>
  <div class="logo3" id="logo2">
    <div class="l-rays"></div>
    <img class="l-img" src="assets/ui/logo.webp" alt="Nur Connect">
    <i class="l-shine"></i>
    <img class="spark s1" src="assets/ui/star.webp" alt=""><img class="spark s2" src="assets/ui/star.webp" alt=""><img class="spark s3" src="assets/ui/star.webp" alt="">
  </div>
  <button class="playimg" id="bIntroPlay" aria-label="Play"><img src="assets/ui/play-button.webp" alt=""></button>
  <div class="copy" id="tCopy"></div>
</div>

<!-- Scene 2: choose a world -->
<div class="ov" id="ovHome" hidden>
  <div class="pick">
    <div class="pk-top">
      <button class="tool sm" id="bBack" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M10.5 5 4 12l6.5 7v-4.3H20V9.3h-9.5z" fill="#fff" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg></button>
      <div class="pk-mid"><div class="pill"><img src="assets/ui/star.webp" alt=""><span id="hStars">0</span></div><div class="pill streak" id="streakPill" hidden>🕌<span id="streakN"></span></div></div>
      <div class="pk-r"><button class="mbtn big" id="mHome" aria-label="Music"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 17.5V5.2l11-2.2v11.8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/><circle cx="6.4" cy="17.6" r="3.2" fill="currentColor"/><circle cx="17.4" cy="15" r="3.2" fill="currentColor"/><path class="x" d="M3 3l18 18" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg></button><button class="tool sm" id="bHomeSet" aria-label="Settings"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M19.83 9.58 L22.78 9.81 L22.78 14.19 L19.83 14.42 L19.25 15.83 L21.17 18.08 L18.08 21.17 L15.83 19.25 L14.42 19.83 L14.19 22.78 L9.81 22.78 L9.58 19.83 L8.17 19.25 L5.92 21.17 L2.83 18.08 L4.75 15.83 L4.17 14.42 L1.22 14.19 L1.22 9.81 L4.17 9.58 L4.75 8.17 L2.83 5.92 L5.92 2.83 L8.17 4.75 L9.58 4.17 L9.81 1.22 L14.19 1.22 L14.42 4.17 L15.83 4.75 L18.08 2.83 L21.17 5.92 L19.25 8.17Z M15.4 12A3.4 3.4 0 1 0 8.6 12A3.4 3.4 0 1 0 15.4 12Z"/></svg></button></div>
    </div>
    <h1 class="pk-title" id="tChoose"></h1>
    <div class="hub"><button class="hubb" id="bDaily"><i>📅</i><span><b id="tDaily"></b><small id="tDailyS"></small></span></button><button class="hubb" id="bAlbum"><i>📒</i><span><b id="tAlbum"></b><small id="tAlbumS"></small></span><em class="dot" id="albDot" hidden></em></button></div>
    <div class="pk-scroll" id="pkScroll"><div class="pk-grid" id="worlds"></div></div>
    <button class="praychip" id="prayChip"><span id="prayTxt">—</span></button>
    <div class="schedpop" id="schedPop" hidden><label id="tSched"></label><div class="sched" id="sched"></div><div class="meta" id="schedMeta"></div></div>
    <button id="bStart" hidden></button><span id="hLvl" hidden></span><p id="tTag" hidden></p>
  </div>
</div>

<!-- Who is playing? (play style) -->
<div class="ov" id="ovStyle" hidden style="z-index:46">
  <div class="card">
    <div class="ribbon green"><img src="assets/ui/ribbon-green.webp" alt=""><span id="styRib"></span></div>
    <div class="stys" id="stys"></div>
    <p id="styHint"></p>
  </div>
</div>

<!-- World map: 20 levels -->
<div class="ov" id="ovMap" hidden>
  <div class="pick">
    <div class="pk-top"><button class="tool sm" id="bMapBack" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M10.5 5 4 12l6.5 7v-4.3H20V9.3h-9.5z" fill="#fff" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg></button>
      <div class="pill"><img src="assets/ui/star.webp" alt=""><span id="mapStars">0</span></div>
      <button class="mbtn big" id="mMap" aria-label="Music"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 17.5V5.2l11-2.2v11.8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/><circle cx="6.4" cy="17.6" r="3.2" fill="currentColor"/><circle cx="17.4" cy="15" r="3.2" fill="currentColor"/><path class="x" d="M3 3l18 18" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg></button></div>
    <div class="map-head"><img id="mapBadge" src="assets/badges/mosque.webp" alt=""><h1 id="mapName"></h1><i id="mapTrophy" hidden>🏆</i></div>
    <div class="pk-scroll" id="mapScroll"><div class="map" id="mapPath"></div></div>
  </div>
</div>

<!-- Sticker book -->
<div class="ov" id="ovAlbum" hidden>
  <div class="pick">
    <div class="pk-top"><button class="tool sm" id="bAlbBack" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M10.5 5 4 12l6.5 7v-4.3H20V9.3h-9.5z" fill="#fff" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg></button>
      <div class="pill"><img src="assets/ui/star.webp" alt=""><span id="albStars">0</span></div>
      <button class="mbtn big" id="mAlb" aria-label="Music"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 17.5V5.2l11-2.2v11.8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/><circle cx="6.4" cy="17.6" r="3.2" fill="currentColor"/><circle cx="17.4" cy="15" r="3.2" fill="currentColor"/><path class="x" d="M3 3l18 18" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg></button></div>
    <h1 class="pk-title" id="tAlbumT"></h1>
    <button class="btn gold" id="bPack"></button>
    <div class="pk-scroll"><div id="albumList"></div></div>
  </div>
  <div class="packov" id="packOv" hidden><div class="packcards" id="packCards"></div><button class="btn" id="bPackOk">OK</button></div>
</div>

<!-- Daily gift (pops over the world screen) -->
<div class="ov" id="ovGift" hidden style="z-index:45">
  <div class="card">
    <div class="ribbon green"><img src="assets/ui/ribbon-green.webp" alt=""><span id="giftRib"></span></div>
    <img class="hero" src="assets/ui/gift.webp" alt="">
    <div class="gdays" id="giftDays"></div>
    <button class="btn gold" id="bGift"></button>
  </div>
</div>

<!-- Bismillah gate -->
<div class="ov" id="ovBis" hidden>
  <div class="card">
    <div class="ribbon green"><img src="assets/ui/ribbon-green.webp" alt=""><span id="bisLvl">Level 1</span></div>
    <img class="hero" id="bisArt" src="assets/badges/mosque.webp" alt="">
    <div class="tip" id="bisTip" hidden></div>
    <div class="ar-big">بِسْمِ ٱللَّٰهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ</div>
    <p id="bisMean"></p>
    <button class="btn" data-ic="play" id="bBis">Bismillah</button>
  </div>
</div>

<!-- Level clear -->
<div class="ov" id="ovWin" hidden>
  <div class="fx"><div class="bigburst"></div></div>
  <div class="card">
    <div class="ribbon green"><img src="assets/ui/ribbon-green.webp" alt=""><span id="winRib"></span></div>
    <div class="rate" id="rate"></div>
    <div class="hero-wrap"><div class="sunburst"></div><div class="glow"></div><img class="hero" src="assets/ui/trophy.webp" alt=""></div>
    <div class="ar-big" style="font-size:40px;line-height:1.4">ٱلْحَمْدُ لِلَّٰهِ</div>
    <h2 id="winTitle"></h2>
    <p id="winBody"></p>
    <div class="rewards"><div class="rw rw-s"><img src="assets/ui/star.webp" alt=""><b id="rwS">0</b><small id="rwSl"></small></div><div class="rw rw-t"><img src="assets/ui/stopwatch.webp" alt=""><b id="rwT">+0</b><small id="rwTl"></small></div></div>
    <div class="gift" id="winGift" hidden><img src="assets/ui/gift.webp" alt=""><span id="winGiftT"></span></div>
    <button class="btn" data-ic="next" id="bNext"></button>
    <button class="btn ghost" data-ic="home" id="bWinHome"></button>
  </div>
</div>

<!-- Time up -->
<div class="ov" id="ovLose" hidden>
  <div class="card">
    <div class="ribbon"><img src="assets/ui/ribbon-red.webp" alt=""><span id="loseTitle"></span></div>
    <div class="ar-big" style="font-size:28px;margin-top:6px">قَدَّرَ ٱللَّٰهُ وَمَا شَاءَ فَعَلَ</div>
    <p id="loseBody"></p>
    <button class="btn" data-ic="retry" id="bRetry"></button>
    <button class="btn ghost" data-ic="home" id="bLoseHome"></button>
  </div>
</div>

<!-- Pause -->
<div class="ov" id="ovPause" hidden>
  <div class="card">
    <div class="ribbon green"><img src="assets/ui/ribbon-green.webp" alt=""><span id="pauseTitle"></span></div>
    <div class="ar-big" style="font-size:28px;margin-top:6px">سُبْحَانَ ٱللَّٰهِ وَبِحَمْدِهِ</div>
    <p id="pauseBody"></p>
    <button class="btn" data-ic="play" id="bResume"></button>
    <button class="btn ghost" data-ic="home" id="bPauseHome"></button>
  </div>
</div>

<!-- Settings -->
<div class="ov" id="ovSet" hidden>
  <div class="card" style="text-align:left">
    <div class="ribbon green"><img src="assets/ui/ribbon-green.webp" alt=""><span id="setTitle"></span></div>
    <div class="field"><label data-ic="pin" id="lCity" for="city"></label><select id="city"></select></div>
    <div class="row" id="customRow" hidden>
      <div class="field"><label for="lat">Lat</label><input id="lat" type="number" step="0.0001"></div>
      <div class="field"><label for="lng">Lng</label><input id="lng" type="number" step="0.0001"></div>
    </div>
    <div class="field"><label id="lStyle"></label><button class="btn ghost" id="bStyle"></button></div>
    <div class="field"><label data-ic="globe" id="lLang"></label><div class="seg" id="segLang"><button data-v="en">🇬🇧 English</button><button data-v="id">🇮🇩 Indonesia</button></div></div>
    <div class="field"><label data-ic="clock" id="lWait"></label><div class="seg" id="segWait"><button data-v="5">5 min</button><button data-v="10">10 min</button><button data-v="15">15 min</button><button data-v="20">20 min</button></div></div>
    <div class="field"><label data-ic="sound" id="lSound"></label><div class="seg" id="segSound"><button data-v="1" data-ic="sound"></button><button data-v="0" data-ic="mute"></button></div></div>
    <div class="field"><label data-ic="voice" id="lVoice"></label><div class="seg" id="segVoice"><button data-v="1" data-ic="voice"></button><button data-v="0" data-ic="novoice"></button></div></div>
    <div class="field"><label data-ic="music" id="lMusic"></label><div class="seg" id="segMusic"><button data-v="1" data-ic="music"></button><button data-v="0" data-ic="mute"></button></div></div>
    <button class="btn ghost" data-ic="bell" id="bPreview"></button>
    <button class="btn ghost" data-ic="trash" id="bReset"></button>
    <button class="btn" data-ic="check" id="bSetDone"></button>
  </div>
</div>

<!-- Prayer lock -->
<div class="ov lock" id="ovLock" hidden>
  <div class="card">
    <div class="ribbon green"><img src="assets/ui/ribbon-green.webp" alt=""><span id="lockRib"></span></div>
    <img class="hero" src="assets/badges/mosque.webp" alt="">

function tension(sec){const dz=$('#danger'),tp=$('#timerPill');dz.classList.add('on');
  if(sec===30&&!hurried[30]){hurried[30]=1;voice('hurry30')}
  if(sec===10&&!hurried[10]){hurried[10]=1;voice('hurry')}
  if(sec>10)sfx.tick(sec%2);else if(sec>5){sfx.tick(sec%2);sfx.heart()}else{sfx.beep();sfx.heart()}
  const k=sec>10?.32+(30-sec)*.012:sec>5?.62:.85;dz.style.setProperty('--dz',k);
  const pulse=()=>{dz.classList.remove('beat');void dz.offsetWidth;dz.classList.add('beat')};pulse();
  if(sec<=10)setTimeout(()=>{if(G.running&&!blocked())pulse()},200);   /* second beat of the heartbeat */
  const cls=sec<=5?'shake':'beat';tp.classList.remove('beat','shake');void tp.offsetWidth;tp.classList.add(cls);
  if(sec<=10)buzz(sec<=5?[30,60,30]:20)}

  $('#stys').innerHTML=Object.entries(STYLES).map(([k,v],i)=>`<button class="sty${S.style===k?' on':''}" data-k="${k}" style="--i:${i};--c1:${STYC[k][0]};--c2:${STYC[k][1]};--c3:${STYC[k][2]}"><i>${v.em}</i><b>${t('st_'+k)}</b><small>${v.age==='13+'?t('agesFam'):v.age+' '+t('yrs')}</small><em>${t('lvlsN',{n:v.n})}</em></button>`).join('');
  G.afterStyle=after||null;$('#ovStyle').hidden=false}
$('#stys').onclick=e=>{const b=e.target.closest('.sty');if(!b)return;ensureAudio();S.style=b.dataset.k;try{store.set('settings',S)}catch(_){}sfx.praise();
  $('#ovStyle').hidden=true;renderHome();if(G.afterStyle)setTimeout(G.afterStyle,400)};
$('#bAlbBack').onclick=()=>{ensureAudio();renderHome();show('ovHome')};

/* ---- Scene 1: intro ---- */
$('#bIntroPlay').onclick=()=>{ensureAudio();sfx.start();voice('bism');buzz(20);const o=$('#ovIntro');o.classList.add('leave');
  setTimeout(()=>{o.classList.remove('leave');renderHome();show('ovHome');if(!S.style)openStyle(checkGift);else setTimeout(checkGift,700)},450)};
function renderHome(){const c=cityInfo(),td=sched(0),now=Date.now(),a=activePrayer(now);
  $('#tTag').textContent=t('tag');$('#tCopy').textContent=t('copy');$('#hLvl').textContent=G.level;$('#hStars').textContent=G.total;renderWorlds();if(!G.running)setBg(curWorld().bgs[0]);
  $('#tSched').textContent=t('sched')+' · '+c.name;$('#schedMeta').textContent=t('method');
  $('#sched').innerHTML=FIVE.map(p=>{const k=td.key+':'+p,isNow=a&&a.key===k;return`<div class="${isNow?'now':''}"><small>${pn(p)}</small><b>${td.t[p]?fmtT(td.t[p],c.tz):'—'}</b><span class="ck">${prayed[k]?'✓':''}</span></div>`}).join('');
  $('#bStart').textContent=(G.level>1?t('cont',{n:G.level}):t('start'));
  $('#bisMean').textContent=t('bisMean');$('#bBis').textContent=t('bis');$('#bNext').textContent=t('next');$('#bWinHome').textContent=t('home');
  $('#bRetry').textContent=t('retry');$('#bLoseHome').textContent=t('home');$('#pauseTitle').textContent=t('pause');$('#pauseBody').textContent=t('pauseB');
  $('#bResume').textContent=t('resume');$('#bPauseHome').textContent=t('home');hud();renderChip(now)}

/* ---------- Settings ---------- */
let returnTo='ovHome';
function openSettings(){returnTo=OVS.find(o=>!$('#'+o).hidden)||(G.running?null:'ovHome');
  $('#setTitle').textContent=t('setT');$('#lCity').textContent=t('city');$('#lLang').textContent=t('lang');$('#lStyle').textContent=t('styleL');$('#bStyle').textContent=sty().em+' '+t('st_'+(S.style||'family'))+' · '+t('lvlsN',{n:lpw()});$('#lWait').textContent=t('wait');$('#lSound').textContent=t('sound');$('#lVoice').textContent=t('voice');$('#lMusic').textContent=t('music');
  $('#bPreview').textContent=t('preview');$('#bReset').textContent=t('reset');$('#bSetDone').textContent=t('done');
  for(const id of ['segSound','segVoice','segMusic']){const sb=$('#'+id).children;sb[0].textContent=t('on');sb[1].textContent=t('off')}
  $('#city').innerHTML=CITIES.map(c=>`<option value="${c[0]}">${c[0]==='custom'?t('custom'):c[1]}</option>`).join('');$('#city').value=S.city;
  $('#lat').value=S.lat;$('#lng').value=S.lng;$('#customRow').hidden=S.city!=='custom';segs();show('ovSet')}
function segs(){[['segLang','lang'],['segWait','wait'],['segSound','sound'],['segVoice','voice'],['segMusic','music']].forEach(([id,k])=>[...$('#'+id).children].forEach(b=>b.classList.toggle('on',String(S[k])===b.dataset.v)))}
function save(){store.set('settings',S);cache={};lastCheck=0}
$('#city').onchange=e=>{S.city=e.target.value;$('#customRow').hidden=S.city!=='custom';save()};
$('#lat').oninput=e=>{S.lat=parseFloat(e.target.value)||0;save()};$('#lng').oninput=e=>{S.lng=parseFloat(e.target.value)||0;save()};
$('#bStyle').onclick=()=>{ensureAudio();$('#ovSet').hidden=true;openStyle(()=>openSettings())};
$('#segLang').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.lang=b.dataset.v;save();openSettings();renderHome()};
$('#segWait').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.wait=+b.dataset.v;save();segs()};
$('#segSound').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.sound=+b.dataset.v;save();segs();ensureAudio();sfx.click();setMusic(S.music)};
$('#segMusic').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.music=+b.dataset.v;save();segs();ensureAudio();setMusic(S.music)};
$('#segVoice').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.voice=+b.dataset.v;save();segs();ensureAudio();if(S.voice)voice('masya1',PR.masya1[S.lang][1]);else stopVoice()};
$('#bPreview').onclick=()=>{ensureAudio();const nx=nextPrayer(Date.now());$('#ovSet').hidden=true;if(returnTo&&returnTo!=='ovSet')$('#'+returnTo).hidden=false;lock={p:nx.p,key:'demo',demo:true,readyAt:Date.now()+8000};openLock()};
$('#bReset').onclick=()=>{G.level=1;G.total=0;G.grid=[];G.running=false;store.set('level',1);WORLDS.forEach(w=>store.set('lv:'+w.id,1));store.set('stars',0);$('#bReset').textContent=t('resetDone');returnTo='ovHome'};
$('#bSetDone').onclick=()=>{renderHome();show(returnTo)};

window.addEventListener('resize',fit);fit();
document.querySelectorAll('.mbtn').forEach(b=>b.classList.toggle('off',!S.music||!S.sound));renderHome();show('ovIntro');
/* if the device already allows sound (e.g. the store app), start the music on the intro; otherwise it starts on the first tap */
ensureAudio();setTimeout(()=>{if(ac&&ac.state==='running')musicOn()},300);tickPrayer(Date.now());
})();
</script>

</body>
</html>
